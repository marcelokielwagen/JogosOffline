<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e9e2d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="../../js/suite.js"></script>
<title>Dustline</title>
<style>
/*ESTILO*/

<body>
<canvas id="tela" aria-label="Rali numa estrada de terra, em 3D"></canvas>
<div id="veu"></div>

<!-- tela inicial: escolher pista e modo -->
<section id="inicio">
  <a id="sair" href="../../index.html" aria-label="Voltar para a coleção de jogos" title="Coleção de jogos"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></a>
  <div id="titulo"><h1>dustline</h1></div>
  <div id="modos" role="radiogroup" aria-label="Modo">
    <button data-modo="tempo" role="radio" aria-checked="true">contra o relógio</button>
    <button data-modo="livre" role="radio" aria-checked="false">passeio livre</button>
  </div>
  <div id="pistas" role="list"></div>
</section>

<!-- durante a corrida -->
<div id="painel" hidden>
  <button id="bVoltar" aria-label="Voltar para as pistas" title="Pistas"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="relogio" aria-live="off"></div>
  <div id="marcos" aria-hidden="true"></div>
</div>
<div id="contagem" aria-live="assertive"></div>
<div id="aviso" aria-live="polite"></div>
<section id="fim" hidden>
  <div class="cartao">
    <p class="nome"></p><p class="tempo"></p><p class="melhor"></p>
    <div class="acoes">
      <button id="bDeNovo"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></svg>de novo</button>
      <button id="bProxima"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>próxima</button>
      <button id="bPistas"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>pistas</button>
    </div>
  </div>
</section>

<div id="controles" aria-hidden="true">
  <div class="lado esq"><button data-k="esq" aria-label="Virar à esquerda"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button data-k="dir" aria-label="Virar à direita"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="lado dir"><div class="pilha"><button data-k="mao" class="mao" aria-label="Freio de mão"><svg viewBox="0 0 24 24"><path d="M8 18h8M12 18V6M9 9l3-3 3 3"/></svg></button><button data-k="freio" aria-label="Frear"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button></div><button data-k="gas" class="gas" aria-label="Acelerar"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button></div>
</div>
<nav id="botoes"><button id="bSom" aria-label="Volume" title="Volume"><svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3.5v-11L8 10z"/><path class="o1" d="M15 9.5a3.6 3.6 0 0 1 0 5"/><path class="o2" d="M17.4 7.2a7 7 0 0 1 0 9.6"/><path class="ox" d="m15.5 10 4 4m0-4-4 4"/></svg></button></nav>
<div id="semgl" hidden>Este aparelho não conseguiu abrir o desenho em 3D.</div>

</html>
