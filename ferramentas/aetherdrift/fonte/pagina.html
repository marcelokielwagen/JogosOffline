<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8e9d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="../../js/suite.js"></script>
<title>AetherDrift: Solar Valley</title>
<style>
/*ESTILO*/
</style>
</head>
<body>
<canvas id="tela" aria-label="Vale ensolarado em 3D"></canvas>
<div id="veu"></div>

<!-- abertura: o mundo já aparece ao fundo, girando devagar -->
<section id="abertura">
  <a id="sair" href="../../index.html" aria-label="Voltar para a coleção de jogos" title="Coleção de jogos"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></a>
  <div class="titulo">
    <h1>AetherDrift</h1>
    <p class="sub">Solar Valley</p>
    <p class="lema">ande, dirija e plane por vales de sol</p>
  </div>
  <button id="bComecar" class="grande">começar</button>
  <p class="nota">melhor com som · fones deixam a brisa mais bonita</p>
</section>

<!-- seletor de fases (os cartões são criados pelo jogo a partir da lista FASES) -->
<section id="fases" hidden>
  <div class="painel">
    <h2>Fases</h2>
    <div id="cartoes" role="list"></div>
    <p class="nota">1 andar · 2 carro · 3 voo — troque quando quiser</p>
  </div>
</section>

<!-- interface durante o jogo -->
<div id="hud" hidden>
  <div id="topoEsq">
    <div id="nomeFase"></div>
    <div id="elos"></div>
  </div>
  <div id="topoDir">
    <button id="bSom" class="redondo" aria-label="Volume" title="Volume (M)"><svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3.5v-11L8 10z"/><path class="o1" d="M15 9.5a3.6 3.6 0 0 1 0 5"/><path class="o2" d="M17.4 7.2a7 7 0 0 1 0 9.6"/><path class="ox" d="m15.5 10 4 4m0-4-4 4"/></svg></button>
    <button id="bMenu" class="redondo" aria-label="Fases" title="Fases"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <div id="volume" hidden><input id="rVolume" type="range" min="0" max="100" aria-label="Volume"><button id="bMudo">sem som</button></div>
  </div>
  <div id="modos" role="radiogroup" aria-label="Forma">
    <button data-modo="andar" role="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v6m0 0-3 6m3-6 3 6M8 11h8"/></svg><span>andar</span><b>1</b></button>
    <button data-modo="carro" role="radio"><svg viewBox="0 0 24 24"><path d="M4 15h16v-3l-2-4H8l-3 4zM7 15v2m10-2v2"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg><span>carro</span><b>2</b></button>
    <button data-modo="voo" role="radio"><svg viewBox="0 0 24 24"><path d="M2 12c4-1 7-3 10-6 3 3 6 5 10 6-4 1-7 2-10 2s-6-1-10-2z"/><path d="M12 14v4"/></svg><span>voo</span><b>3</b></button>
  </div>
  <div id="joy" aria-hidden="true"><div id="joyBase"><div id="joyPino"></div></div></div>
  <button id="bPulo" class="redondo grande" aria-label="Pular"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <div id="ajuda"></div>
</div>
<div id="aviso" aria-live="polite"></div>

<section id="concluida" hidden>
  <div class="painel">
    <p class="selo">✦</p>
    <h2 id="cTitulo"></h2>
    <p id="cTexto"></p>
    <div class="acoes"><button id="bExplorar">continuar explorando</button><button id="bOutras" class="grande">fases</button></div>
  </div>
</section>

<div id="semgl" hidden>Este aparelho não conseguiu abrir o desenho em 3D.</div>
<script>
'use strict';
/*THREE*/
</script>
<script>
(() => { 'use strict';
/*JOGO*/
})();
</script>
</body>
</html>
