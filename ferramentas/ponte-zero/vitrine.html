<!doctype html><meta charset="utf-8"><title>Vitrine dos personagens</title>
<style>body{margin:0;background:#222}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../lib/three/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { carregarModelos, texturaRuido, Multidao } from '../../jogos/ponte-zero/cena/personagens.js';
import { MODELOS } from '../../jogos/ponte-zero/cena/armas.js';
import { PEGADAS } from '../../jogos/ponte-zero/cena/animacoes.js';
const { Chefe } = await import('../../jogos/ponte-zero/cena/chefes.js').catch(e => (console.log(e.message), {}));
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); document.body.append(R.domElement); R.setSize(innerWidth, innerHeight); R.setPixelRatio(devicePixelRatio);
R.toneMapping = THREE.NeutralToneMapping; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const C = new THREE.Scene(); C.background = new THREE.Color('#f0a868'); C.fog = new THREE.Fog('#f0a868', 60, 200);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, .1, 200);
C.add(new THREE.HemisphereLight('#cfe0ff', '#a06a5a', 1.5)); const sol = new THREE.DirectionalLight('#fff0d8', 2.6); sol.position.set(5, 9, 7); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 }); sol.shadow.bias = -.001; C.add(sol);
const chao = new THREE.Mesh(new THREE.PlaneGeometry(90, 90).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#6b6478' })); chao.receiveShadow = true; C.add(chao);
const mods = await carregarModelos('../../jogos/ponte-zero/recursos/personagens.bin'), ru = texturaRuido();
const p = new URLSearchParams(location.search), lod = +(p.get('lod') || 0);
const nova = (m, t) => new Multidao(C, mods[m], m, { max: 20, tipo: t, ruido: ru, lods: [lod], pal: {} });
const S = nova('soldado', 0), Z = nova('zumbi', 1), O = nova('gordo', 1); MODELOS.forEach(f => S.acessorio(f())); const pgs = Object.keys(PEGADAS);
window.ver = (t, camPos, alvo, modo = 'corre', ang = 0) => {
  cam.position.set(...camPos); cam.lookAt(...alvo); for (const m of [S, Z, O]) m.limpar();
  for (let i = 0; i < 6; i++) S.por(-4.4 + i * .95, 0, 0, ang + (i - 2.5) * .12, 1, 1, modo === 'comemora' ? S.quadro('comemora', t + i * .17) : modo === 'morre' ? S.quadro('morre_' + pgs[i], (i + 1) / 6, false) : S.quadro(modo + '_' + pgs[i], t + i * .17), i * .17 + .05, 0, 0, i > 2 ? i - 2 : 0, true, i);
  for (let i = 0; i < 4; i++) Z.por(1.5 + i * .9, 0, 0, ang - .3 + i * .25, 1, 1, modo === 'morre' ? Z.quadro(i % 2 ? 'morre1' : 'morre0', (i + .5) / 4, false) : Z.quadro(['anda0', 'anda1', 'corre', 'anda0'][i], t + i * .2), i * .21 + .07, 0, 0, i === 2 ? 1 : 0);
  O.por(5.4, 0, 0, ang, 1, 1, modo === 'morre' ? O.quadro('morre0', .9, false) : O.quadro('anda0', t), .4, 0, 0);
  for (const m of [S, Z, O]) m.fechar(); R.render(C, cam);
};
let ch = null;
window.verChefe = (id, pose, k, camPos, alvo, ang = 0) => { for (const m of [S, Z, O]) { m.limpar(); m.fechar(); } ch?.dispose(); ch = new Chefe(C, mods, id, ru); ch.teste(pose, k, ang); cam.position.set(...camPos); cam.lookAt(...alvo); R.render(C, cam); };
ver(0, [0, 2, 9], [0, .95, 0]); window.pronto = true;
</script>
