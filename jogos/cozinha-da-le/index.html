<!doctype html>
<html lang="pt-BR">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Cozinha da Le</title>
<script src="../../js/suite.js"></script>
<style>
/* ============================================================ APARÊNCIA */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%;
  background:radial-gradient(120% 90% at 50% 20%,#fbe3d6,#e9d3ea 60%,#d6e6ea); font-family:"Trebuchet MS",system-ui,sans-serif;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; color:#4a3226; }
#palco { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; touch-action:none;
  box-shadow:0 0 40px rgba(90,50,40,.25); --u:1px; }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
.voltar { position:absolute; left:2.2%; top:6.5%; width:calc(var(--u)*40); height:calc(var(--u)*40); border-radius:50%;
  background:#fff; border:calc(var(--u)*3) solid #7a4a36; display:grid; place-items:center; text-decoration:none; }
.voltar svg { width:60%; height:60%; fill:none; stroke:#7a4a36; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div id="palco">
  <canvas id="cv" role="img" aria-label="Balcão da Cozinha da Le com três personagens fantasiados"></canvas>
  <a class="voltar jo-sair" href="../../index.html" aria-label="Voltar ao menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
</div>
<script>
'use strict';
/* =====================================================================
   COZINHA DA LE — Fase 1: balcão, personagens e camarim. Fase 2: tabuleiro de pilhas. Fase 3: entregas, moedas e ajudas. Fase 4: som, salvar e polimento.
   Tudo desenhado em Canvas 2D (sem imagens), tamanho lógico 540 x 960.
   ===================================================================== */
const W = 540, H = 960, YB = 410, ESC = 1.12, TAU = Math.PI * 2, OUT = '#4a3226';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const palco = document.getElementById('palco');
let esc = 1, dpr = 1, T = 0;

function medir() {
  const w = Math.min(innerWidth, innerHeight * W / H), h = w * H / W;
  palco.style.width = w + 'px'; palco.style.height = h + 'px';
  dpr = Math.min(2.5, devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  esc = w / W; palco.style.setProperty('--u', esc + 'px');
}
addEventListener('resize', medir); medir();

/* ------------------------------------------------------------ ajudantes de desenho */
function rnd(seed) { let x = seed; return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; }; }
function el(x, y, rx, ry, c, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); if (c) { ctx.fillStyle = c; ctx.fill(); } }
function linha(c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
// silhueta: contorno escuro por fora + preenchimento (peças de várias partes ficam com um contorno só)
function sil(path, fill, w = 3, cor = OUT) { ctx.beginPath(); path(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = w * 2; ctx.strokeStyle = cor; ctx.stroke(); ctx.fillStyle = fill; ctx.fill(); }
const easeIn = u => u * u * u, easeOut = u => 1 - Math.pow(1 - u, 3);
const back = u => { const c = 1.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function brilho4(x, y, r, c) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fillStyle = c; ctx.fill(); }
function estrela5(x, y, r, c, rot = 0) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); ctx.fillStyle = c; ctx.fill(); linha(OUT, 1.4); }
function coracao(x, y, s, c) { ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10); ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(-11, -3, -7, -13, 0, -6); ctx.bezierCurveTo(7, -13, 11, -3, 0, 5); ctx.fillStyle = c; ctx.fill(); linha(OUT, 1.5); ctx.restore(); }
function flor(x, y, r, cp, cc) { for (let i = 0; i < 5; i++) { const a = i * TAU / 5; el(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .55, r * .55, r * .4, cp, a); } el(x, y, r * .32, r * .32, cc); }
function pontos(n, seed, fx, fy) { const r = rnd(seed), a = []; for (let i = 0; i < n; i++) a.push([fx(r()), fy(r()), r(), .7 + r() * 1.1]); return a; }

/* ------------------------------------------------------------ COMIDAS (também usadas na Fase 2) */
function dAbacate(r) {
  ctx.rotate(-.35);
  sil(() => ctx.ellipse(0, 0, r * .74, r * .98, 0, 0, TAU), '#4e7f2e', 2);
  el(0, r * .06, r * .6, r * .82, '#c9e27a'); el(0, r * .12, r * .46, r * .64, '#e6f3a6');
  sil(() => ctx.ellipse(0, r * .24, r * .3, r * .3, 0, 0, TAU), '#8b5a30', 1.6);
  el(-r * .1, r * .14, r * .1, r * .07, 'rgba(255,255,255,.55)');
}
function dAbacaxi(r) {
  for (const [a, l] of [[-.6, .62], [-.28, .85], [0, 1], [.28, .85], [.6, .62]]) {
    ctx.save(); ctx.translate(0, -r * .32); ctx.rotate(a);
    sil(() => { ctx.moveTo(-r * .14, 0); ctx.quadraticCurveTo(-r * .05, -r * l * .6, 0, -r * l); ctx.quadraticCurveTo(r * .05, -r * l * .6, r * .14, 0); ctx.closePath(); }, '#62b04a', 1.4);
    ctx.restore();
  }
  const corpo = () => ctx.ellipse(0, r * .3, r * .6, r * .7, 0, 0, TAU);
  sil(corpo, '#f4b62f', 2);
  ctx.save(); ctx.beginPath(); corpo(); ctx.clip(); ctx.strokeStyle = '#c98a1e'; ctx.lineWidth = r * .06;
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(-r + k * r * .32, -r * .5); ctx.lineTo(r + k * r * .32, r * 1.1); ctx.moveTo(r - k * r * .32, -r * .5); ctx.lineTo(-r - k * r * .32, r * 1.1); ctx.stroke(); }
  el(-r * .25, r * .05, r * .12, r * .2, 'rgba(255,255,255,.4)'); ctx.restore();
}
function dPimentao(r) {
  sil(() => { ctx.ellipse(-r * .32, r * .12, r * .42, r * .66, -.15, 0, TAU); ctx.moveTo(r * .74, r * .12); ctx.ellipse(r * .32, r * .12, r * .42, r * .66, .15, 0, TAU); ctx.moveTo(r * .45, r * .18); ctx.ellipse(0, r * .18, r * .45, r * .7, 0, 0, TAU); }, '#f7c52e', 2);
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * .13, -r * .3); ctx.quadraticCurveTo(s * r * .22, r * .3, s * r * .1, r * .78); linha('rgba(200,130,20,.55)', r * .07); }
  el(-r * .34, -r * .02, r * .09, r * .22, 'rgba(255,255,255,.55)', -.2);
  el(0, -r * .44, r * .28, r * .11, '#6db04a');
  sil(() => { ctx.moveTo(-r * .08, -r * .46); ctx.quadraticCurveTo(-r * .04, -r * .8, r * .2, -r * .86); ctx.lineTo(r * .22, -r * .72); ctx.quadraticCurveTo(r * .06, -r * .7, r * .1, -r * .46); ctx.closePath(); }, '#5a9a3e', 1.4);
}
function dCastanha(r) {
  const um = (x, y, s, rot) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    const path = () => { ctx.moveTo(0, -r * .62); ctx.quadraticCurveTo(r * .72, -r * .38, r * .6, r * .22); ctx.quadraticCurveTo(r * .5, r * .6, 0, r * .6); ctx.quadraticCurveTo(-r * .5, r * .6, -r * .6, r * .22); ctx.quadraticCurveTo(-r * .72, -r * .38, 0, -r * .62); };
    sil(path, '#7b4527', 2);
    ctx.save(); ctx.beginPath(); path(); ctx.clip(); el(0, r * .64, r * .72, r * .3, '#d8b48a'); ctx.restore();
    el(-r * .22, -r * .18, r * .1, r * .22, 'rgba(255,255,255,.35)', -.4);
    ctx.beginPath(); ctx.moveTo(0, -r * .62); ctx.lineTo(0, -r * .76); linha('#5a3018', 2.4);
    ctx.restore();
  };
  um(-r * .36, r * .1, .74, -.3); um(r * .36, r * .04, .74, .3);
}
function dUva(r) {
  const g = [[-.36, -.25], [0, -.27], [.36, -.25], [-.18, .07], [.18, .07], [0, .4]];
  sil(() => { for (const [x, y] of g) { ctx.moveTo(x * r + r * .26, y * r); ctx.arc(x * r, y * r, r * .26, 0, TAU); } }, '#9a5bb8', 1.8);
  for (const [x, y] of g) { ctx.beginPath(); ctx.arc(x * r, y * r, r * .26, 0, TAU); linha('rgba(90,40,110,.5)', 1.2); el(x * r - r * .08, y * r - r * .08, r * .07, r * .06, 'rgba(255,255,255,.7)'); }
  ctx.beginPath(); ctx.moveTo(0, -r * .5); ctx.lineTo(r * .05, -r * .78); linha('#6b4a2a', r * .09);
  sil(() => ctx.ellipse(r * .3, -r * .62, r * .26, r * .14, -.4, 0, TAU), '#62b04a', 1.4);
}
function dMilho(r) {
  for (const s of [-1, 1]) sil(() => { ctx.moveTo(0, r * .9); ctx.quadraticCurveTo(s * r * .7, r * .5, s * r * .38, -r * .5); ctx.quadraticCurveTo(s * r * .3, r * .2, 0, r * .9); }, '#6cb34e', 1.6);
  const cob = () => ctx.ellipse(0, -r * .05, r * .34, r * .8, 0, 0, TAU);
  sil(cob, '#f6cf3e', 2);
  ctx.save(); ctx.beginPath(); cob(); ctx.clip();
  for (let yy = -6; yy <= 6; yy++) for (let xx = -2; xx <= 2; xx++) el(xx * r * .15 + (yy % 2 ? r * .075 : 0), yy * r * .13, r * .06, r * .055, '#fde68a');
  ctx.restore();
  for (const s of [-1, 1]) sil(() => { ctx.moveTo(s * r * .05, r * .9); ctx.quadraticCurveTo(s * r * .55, r * .55, s * r * .3, r * .05); ctx.quadraticCurveTo(s * r * .25, r * .5, s * r * .05, r * .9); }, '#7cc45e', 1.4);
}
function dCenoura(r) {
  ctx.rotate(.55);
  for (const a of [-.5, 0, .5]) { ctx.save(); ctx.translate(0, -r * .6); ctx.rotate(a); sil(() => ctx.ellipse(0, -r * .28, r * .11, r * .3, 0, 0, TAU), '#62b04a', 1.4); ctx.restore(); }
  sil(() => { ctx.moveTo(-r * .36, -r * .55); ctx.quadraticCurveTo(0, -r * .72, r * .36, -r * .55); ctx.quadraticCurveTo(r * .2, r * .3, 0, r * .95); ctx.quadraticCurveTo(-r * .2, r * .3, -r * .36, -r * .55); }, '#f2852b', 2);
  for (const y of [-.25, .05, .35]) { ctx.beginPath(); ctx.moveTo(-r * .2, y * r); ctx.lineTo(-r * .05, y * r + r * .04); linha('#c55e16', r * .05); }
  el(-r * .14, -r * .3, r * .05, r * .2, 'rgba(255,255,255,.45)');
}
function dMorango(r) {
  const corpo = () => { ctx.moveTo(0, r * .9); ctx.bezierCurveTo(-r * .95, r * .2, -r * .8, -r * .62, 0, -r * .45); ctx.bezierCurveTo(r * .8, -r * .62, r * .95, r * .2, 0, r * .9); };
  sil(corpo, '#e8473f', 2);
  for (const [x, y] of [[-.3, -.15], [.05, -.2], [.35, -.1], [-.2, .2], [.18, .18], [0, .5], [-.42, .1], [.42, .15]]) el(x * r, y * r, r * .04, r * .06, '#ffe08a');
  el(-r * .3, -r * .22, r * .1, r * .16, 'rgba(255,255,255,.45)', -.3);
  sil(() => { for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * .55; ctx.moveTo(0, -r * .45); ctx.lineTo(Math.cos(a) * r * .45, -r * .45 + Math.sin(a) * r * .3 + r * .15); } }, '#5aa646', 2.5, '#3f7a32');
}
const COMIDAS = {
  abacate: { nome: 'Abacate', cor: '#a7d684', esc: '#6aa64c', d: dAbacate },
  abacaxi: { nome: 'Abacaxi', cor: '#ffd75e', esc: '#d9a92e', d: dAbacaxi },
  pimentao: { nome: 'Pimentão', cor: '#ffb347', esc: '#d98a22', d: dPimentao },
  castanha: { nome: 'Castanha', cor: '#c4936a', esc: '#8a5f3e', d: dCastanha },
  uva: { nome: 'Uva', cor: '#cfa2e4', esc: '#9467b0', d: dUva },
  milho: { nome: 'Milho', cor: '#fff0a0', esc: '#dcc25a', d: dMilho },
  cenoura: { nome: 'Cenoura', cor: '#ffa070', esc: '#d9693c', d: dCenoura },
  morango: { nome: 'Morango', cor: '#ffa4b4', esc: '#d9677e', d: dMorango },
};
function comida(nome, x, y, r) { ctx.save(); ctx.translate(x, y); COMIDAS[nome].d(r); ctx.restore(); }

/* ------------------------------------------------------------ OS 3 PERSONAGENS
   Âncoras (coordenadas locais; 0,0 = topo do balcão no centro do personagem):
   hy = centro da cabeça; top = topo da cabeça; neck = gola; bw = meia largura do tronco. */
const ANC = {
  humano: { hy: -128, top: -57, rx: 50, eyeY: -2, eyeDx: 19, neck: -76, bw: 60 },
  cocker: { hy: -110, top: -47, rx: 44, eyeY: -6, eyeDx: 19, neck: -66, bw: 48 },
  preto:  { hy: -110, top: -46, rx: 46, eyeY: -9, eyeDx: 19, neck: -66, bw: 48 },
};
const PELE = '#f4c0a3', PELE2 = '#e49d82';
const CK = { branco: '#fbf5ea', laranja: '#d98a3a', laranja2: '#eba75a' };      // cocker ruivo e branco
const PT = { preto: '#26282c', cinza: '#8d8f92', foc: '#cfcbc3' };              // preto grisalho
const BARBA = pontos(190, 7, v => v * 96 - 48, v => v * 60 - 2);
const SAL_PT = pontos(90, 11, v => v * 92 - 46, v => v * 92 - 46);
const SAL_FOC = pontos(60, 13, v => v * 60 - 30, v => v * 44);
const SAL_CORPO = pontos(70, 17, v => v * 90 - 45, v => v * 140 - 66);

/* olho genérico: piscar, olhar para os lados, brilho de vontade e olho fechado de alegria */
function olho(x, y, rx, ry, e, cfg) {
  if (e.feliz || e.pisca > .85) {
    ctx.beginPath();
    if (e.feliz) { ctx.moveTo(x - rx, y + 2); ctx.quadraticCurveTo(x, y - ry * 1.3, x + rx, y + 2); }
    else { ctx.moveTo(x - rx, y + 1); ctx.quadraticCurveTo(x, y + ry * .5, x + rx, y + 1); }
    linha(OUT, 3); return;
  }
  const ix = x + e.ox * rx * .32, iy = y + e.oy * ry * .28;
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (cfg.branco) {
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.clip();
    el(ix, iy, rx * .72, ry * .82, cfg.iris); el(ix, iy, rx * .36, ry * .42, '#1c120c');
  } else { ctx.fillStyle = cfg.iris; ctx.fill(); ctx.clip(); el(ix, iy + ry * .1, rx * .6, ry * .62, cfg.pupila || '#140c08'); }
  if (e.brilho) { brilho4(ix - rx * .2, iy - ry * .25, rx * .62, '#fff'); el(ix + rx * .32, iy + ry * .32, rx * .16, rx * .16, '#fff'); }
  else { el(ix - rx * .28, iy - ry * .3, rx * .3, rx * .3, '#fff'); el(ix + rx * .28, iy + ry * .28, rx * .13, rx * .13, 'rgba(255,255,255,.8)'); }
  if (e.pisca > 0) {
    const yy = y - ry - 1 + (ry * 2 + 2) * e.pisca;
    ctx.fillStyle = cfg.palp; ctx.fillRect(x - rx - 2, y - ry - 2, rx * 2 + 4, yy - (y - ry - 2));
    ctx.beginPath(); ctx.moveTo(x - rx, yy); ctx.lineTo(x + rx, yy); linha(OUT, 2.4);
  }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); linha(OUT, 2.2);
}
function sobrancelha(sd, x, y, len, w, cor, e) {
  const sob = e.sobr * 4, inY = y - sob - (e.triste ? 5 : 0), outY = y - 2 - sob + (e.triste ? 3 : 0);
  ctx.beginPath(); ctx.moveTo(x - sd * len * .5, inY); ctx.quadraticCurveTo(x, Math.min(inY, outY) - 4, x + sd * len * .5, outY); linha(cor, w);
}

/* ---------- PERSONAGEM DO MEIO: rosto redondo e cheio, pele clara rosada de sol, barba e bigode curtos
   ruivos (queixo esbranquiçado), sorrisão largo com dentes, óculos escuros de armação escura com ponte dupla,
   boné verde com "Brooklyn" bordado em amarelo, camiseta branca e correntinha dourada.
   Fantasia com chapéu tira o boné (aparece o cabelo castanho-claro curto); fantasia com óculos ou máscara
   própria tira os óculos escuros (aparecem os olhos). */
function bone(A) {
  const t = A.top, w = A.rx;
  sil(() => { ctx.moveTo(-w * 1.04, t + 27); ctx.bezierCurveTo(-w * 1.07, t - 32, w * 1.07, t - 32, w * 1.04, t + 27); ctx.closePath(); }, '#5f8f5b', 2.6);
  ctx.beginPath(); ctx.moveTo(0, t - 17); ctx.quadraticCurveTo(-w * .5, t - 6, -w * .62, t + 25); ctx.moveTo(0, t - 17); ctx.quadraticCurveTo(w * .5, t - 6, w * .62, t + 25); linha('rgba(40,80,40,.45)', 1.6);
  el(0, t - 17, 4.5, 3, '#4c7849'); linha(OUT, 1.2);
  ctx.save(); ctx.translate(0, t + 8); ctx.rotate(-.06); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 5.5px "Trebuchet MS",sans-serif'; ctx.fillStyle = '#f4b733'; ctx.fillText('NEW YORK', -6, -10);
  ctx.font = 'italic 800 18px "Brush Script MT","Segoe Script","Comic Sans MS",cursive'; ctx.lineWidth = 3; ctx.strokeStyle = '#a8741c'; ctx.strokeText('Brooklyn', 0, 1); ctx.fillStyle = '#f6bb36'; ctx.fillText('Brooklyn', 0, 1);
  ctx.restore();
  sil(() => { ctx.moveTo(-w * 1.13, t + 24); ctx.quadraticCurveTo(0, t + 11, w * 1.13, t + 24); ctx.quadraticCurveTo(w * 1.02, t + 41, 0, t + 43); ctx.quadraticCurveTo(-w * 1.02, t + 41, -w * 1.13, t + 24); }, '#527f4f', 2.6);
  ctx.beginPath(); ctx.moveTo(-w * .95, t + 27); ctx.quadraticCurveTo(0, t + 17, w * .95, t + 27); linha('rgba(255,255,255,.18)', 2);
}
function oculosEscuros(A, e) {
  const y = A.eyeY - (e.feliz ? 2 : 0), dx = A.eyeDx;
  ctx.beginPath(); ctx.moveTo(-A.rx + 1, y - 6); ctx.lineTo(-dx - 15, y - 7); ctx.moveTo(A.rx - 1, y - 6); ctx.lineTo(dx + 15, y - 7); linha('#151716', 3);
  for (const sd of [-1, 1]) {
    const lente = () => ctx.roundRect(sd * dx - 15, y - 11, 30, 23, [9, 9, 11, 11]);
    sil(lente, '#262a29', 1.8, '#121413');
    ctx.save(); ctx.beginPath(); lente(); ctx.clip();
    const g = ctx.createLinearGradient(sd * dx - 15, y - 11, sd * dx + 15, y + 12); g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(.45, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(120,140,130,.25)');
    ctx.fillStyle = g; ctx.fillRect(sd * dx - 16, y - 12, 32, 25);
    ctx.beginPath(); ctx.moveTo(sd * dx - 9, y + 6); ctx.lineTo(sd * dx + 3, y - 8); linha('rgba(255,255,255,.35)', 2.4);
    ctx.restore();
    if (e.brilho) brilho4(sd * dx + 6, y - 4, 7, '#fff');
  }
  ctx.beginPath(); ctx.moveTo(-dx + 15, y - 9); ctx.lineTo(dx - 15, y - 9); linha('#151716', 2.2);   // ponte de cima (metal)
  ctx.beginPath(); ctx.moveTo(-dx + 14, y - 3); ctx.quadraticCurveTo(0, y - 7, dx - 14, y - 3); linha('#151716', 2.6);
}
function cabecaHumano(e, p) {
  const A = ANC.humano, R = ROUPAS[p.roupa];
  for (const sd of [-1, 1]) { el(sd * 50, 6, 9, 13, PELE); linha(OUT, 3); el(sd * 50, 6, 4, 7, PELE2); }
