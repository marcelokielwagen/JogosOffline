<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{--l:#ffd9a0;--t:rgba(240,238,250,.86);--f:rgba(240,238,250,.66);--p:rgba(16,18,34,.9);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b2140;color:var(--t);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ser{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
#top{position:fixed;top:calc(10px + var(--st));left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#lv{pointer-events:auto;display:flex;flex-direction:column;align-items:center;padding:6px 22px;border-radius:22px;min-height:48px;justify-content:center;transition:background .5s}
#lv b{font-weight:400;font-size:19px;letter-spacing:.02em;line-height:1.2}
#lv span{font-size:13px;color:var(--f);line-height:1.3}
#bk{position:fixed;z-index:1;top:calc(10px + var(--st));left:calc(10px + var(--sl))}#bk[hidden]{display:none}
#bot{position:fixed;bottom:calc(14px + var(--sb));left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none}
#bot i{width:1px;margin:12px 6px;background:rgba(255,255,255,.14)}
.ic{pointer-events:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--f);transition:color .4s,background .4s,opacity .4s}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic[aria-pressed=true]{color:var(--l)}
.ic:disabled{opacity:.3;cursor:default}
@media(hover:hover){.ic:not(:disabled):hover,#lv:hover{background:rgba(255,255,255,.07);color:var(--t)}.n:hover{background:rgba(255,255,255,.1)}}
:focus-visible{outline:2px solid var(--l);outline-offset:2px}
canvas:focus-visible{outline:none}
#msg{position:fixed;left:16px;right:16px;bottom:calc(74px + var(--sb));text-align:center;font-size:17px;pointer-events:none;opacity:0;transition:opacity 1.2s;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.6)}
#msg.on{opacity:1}
#snd{position:fixed;bottom:calc(74px + var(--sb));left:50%;width:min(320px,calc(100% - 32px));transform:translate(-50%,10px);background:var(--p);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px 20px;display:grid;gap:14px;opacity:0;visibility:hidden;transition:opacity .4s,transform .4s,visibility .4s}
#snd.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
#snd label{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;min-height:32px}
#snd label.k{grid-template-columns:1fr auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--l)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--l)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;transition:background .4s}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#e9e7f2;transition:transform .4s,background .4s}
input[type=checkbox]:checked{background:rgba(255,255,255,.3)}
input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--l)}
#sel{position:fixed;z-index:2;inset:0;background:rgba(12,14,28,.94);overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;padding:calc(18px + var(--st)) calc(18px + var(--sr)) calc(40px + var(--sb)) calc(18px + var(--sl));overscroll-behavior:contain}
#sel.on{opacity:1;visibility:visible}
#sel>div{max-width:680px;margin:0 auto}
#sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#sh h1{font-weight:400;font-size:28px;line-height:1.2}
#sh p{color:var(--f)}
.ch{margin-top:22px}
.ch h2{font-weight:400;font-size:17px;display:flex;align-items:baseline;gap:10px;margin-bottom:10px;color:var(--c)}
.ch h2 small{font:400 13px system-ui,sans-serif;color:var(--f)}
.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.n{height:48px;border-radius:24px;background:rgba(255,255,255,.05);color:var(--f);font-variant-numeric:tabular-nums;transition:background .4s;display:flex;align-items:center;justify-content:center;gap:7px}
.n::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3)}
.n.d{color:var(--t)}
.n.d::before{background:var(--c);border-color:var(--c);box-shadow:0 0 10px var(--c)}
.n.a{box-shadow:inset 0 0 0 1.5px var(--c);color:var(--t)}
@media(min-width:640px){.gr{grid-template-columns:repeat(10,1fr)}.n{padding:0;gap:5px}}
@media(orientation:landscape) and (max-height:520px){
#top{left:calc(6px + var(--sl));right:auto;top:calc(8px + var(--st))}#lv{padding:6px 10px;max-width:104px}#lv b{font-size:16px}
#bk{top:auto;bottom:calc(8px + var(--sb))}#bot{left:auto;right:calc(6px + var(--sr));top:0;bottom:0;flex-direction:column;align-items:center;gap:0}#bot i{width:24px;height:1px;margin:3px 0}
#msg{bottom:8px;left:112px;right:70px;font-size:15px}
#snd{left:auto;right:calc(66px + var(--sr));bottom:10px;transform:translate(10px,0)}#snd.on{transform:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" role="application" aria-label="Tabuleiro. Setas escolhem a peça, Enter gira, Z desfaz, R recomeça, D dica, M silencia."></canvas>

<i></i>

<button class="ic" id="ba" aria-label="Som ambiente" title="Som ambiente"><svg viewBox="0 0 24 24"><path d="M3 9h10.5a2.7 2.7 0 1 0-2.6-3.4M3 13h15a2.8 2.8 0 1 1-2.7 3.5M3 17h7.5a2.2 2.2 0 1 1-2 3"/></svg></button>

</div>

<label>Volume<input type="range" id="vv" min="0" max="100"></label>
<label>Ambiente<input type="range" id="va" min="0" max="100"></label>

<div id="sel" role="dialog" aria-label="Fases"><div><div id="sh"><div><h1 class="ser">Candeia</h1><p id="sp"></p></div><button class="ic" id="sx" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="sg"></div></div></div>
<script>
'use strict';
const $=i=>document.getElementById(i),TAU=Math.PI*2,M=Math;
const W=[
['Anoitecer','#191f3d','#4a3558','#ffd9a0',48,0,0],
['Âmbar','#231928','#5a332c','#ffc07d',45,1,0],
['Maré','#0c2231','#1f4d58','#9fe9e0',50,2,1],
['Bosque','#0f221d','#31492f','#cdf0a4',43,0,0],
['Colmeia','#271d17','#57421f','#ffe391',48,3,0],
['Lavanda','#1f1a3b','#513b72','#dcc7ff',46,1,1],
['Névoa','#1b2430','#465768','#e0f0ff',41,2,0],
['Coral','#281730','#65344a','#ffbaad',45,3,1],
['Duas Luas','#0c132e','#2b406e','#b0cdff',50,0,0],
['Aurora','#0b1b2a','#1f4a4c','#acf7d0',43,1,1]
];
const TIP={1:'Toque numa peça para girá-la. Leve a luz até todas as lanternas.',2:'Sem pressa. Não existe erro aqui.',11:'Agora os caminhos se dividem.',21:'Alguns caminhos voltam e formam laços.',22:'Nenhuma ponta pode ficar solta.',31:'O tabuleiro ganha desenhos.',41:'Na colmeia, cada peça tem seis posições.',51:'Duas chamas repartem o caminho.',61:'Peças com o mesmo anel giram juntas.',71:'Colmeias com laços.',81:'Chamas, laços e anéis.',91:'O último trecho. Aproveite.'};
const FIM=['Tudo aceso.','Respire fundo.','Luz em toda parte.','Que calma boa.','Em harmonia.','Fique o tempo que quiser.'];

let S={n:1,done:[],vol:70,amb:55,ambOn:true,mute:false,auto:true,b:null};
try{const o=JSON.parse(localStorage.getItem('candeia.v1'));if(o&&typeof o=='object')Object.assign(S,o)}catch(e){}
S.n=M.min(100,M.max(1,S.n|0||1));
S.done=Array.isArray(S.done)?[...new Set(S.done.filter(x=>Number.isInteger(x)&&x>0&&x<101))]:[];
S.vol=M.min(100,M.max(0,+S.vol||0));S.amb=M.min(100,M.max(0,+S.amb||0));
let sv;const save=()=>{clearTimeout(sv);sv=setTimeout(flush,120)};
function flush(){clearTimeout(sv);try{localStorage.setItem('candeia.v1',JSON.stringify(S))}catch(e){}}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=M.imul(a^a>>>15,1|a);t=t+M.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SHP={
full:()=>1,
losango:(u,v)=>M.abs(u)+M.abs(v)<=1.15,
oval:(u,v)=>u*u+v*v<=1.2,
anel:(u,v)=>u*u+v*v<=1.35&&u*u+v*v>.12,
janela:(u,v)=>!(M.abs(M.abs(u)-.5)<.12&&M.abs(M.abs(v)-.5)<.15),
ampulheta:(u,v)=>M.abs(u)<=.36+M.abs(v)*.72,
cruz:(u,v)=>M.abs(u)<.5||M.abs(v)<.45,
taça:(u,v)=>v<.1||M.abs(u)<.4||v>.8,
asas:(u,v)=>M.abs(v)<=.4+M.abs(u)*.7,
arco:(u,v)=>v<-.2?u*u+(v+.2)*(v+.2)*1.5<=1.15:M.abs(u)>.3
};
const SK=['losango','cruz','oval','ampulheta','anel','asas','janela','taça','arco','losango'];
function spec(n){
const w=(n-1)/10|0,k=(n-1)%10,L=(a,b)=>M.round(a+(b-a)*k/9),o={hex:0,c:5,r:5,sh:'full',dfs:0,loop:0,sym:0,src:1,tw:0,lk:0,mix:.8};
if(w==0){const z=[[3,3],[3,3],[3,4],[3,4],[4,4],[4,4],[4,5],[4,5],[4,5],[5,5]][k];o.c=z[0];o.r=z[1];o.dfs=1;o.mix=.75}
else if(w==1){o.c=L(4,5);o.r=L(5,6);o.dfs=k<3?.6:0}
else if(w==2){o.c=L(5,6);o.r=L(5,7);o.loop=.1+k*.02;o.sym=k%2}
else if(w==3){o.c=k<4?5:7;o.r=k<4?7:L(7,9);o.sh=SK[k];o.sym=k%3==1?1:0;o.loop=.06}
else if(w==4){o.hex=1;o.c=L(4,6);o.r=L(3,7);o.sh=k==5||k==8?'oval':'full';o.lk=.06}
else if(w==5){o.c=L(5,6);o.r=L(6,8);o.src=2;o.loop=k>4?.08:0;o.lk=.05}
else if(w==6){o.c=L(5,6);o.r=L(5,8);o.tw=1+(k/3|0);o.sh=k==7?'anel':'full'}
else if(w==7){o.hex=1;o.c=L(5,6);o.r=L(5,9);o.loop=.1;o.sym=k%2;o.sh=k==4||k==9?'losango':k==6?'anel':'full';o.lk=.1}
else if(w==8){o.c=L(6,7);o.r=L(7,9);o.src=2;o.tw=1+(k>>2);o.loop=.07;o.sh=k%4==3?'oval':'full';o.lk=.06}
else{o.hex=k%2;o.c=o.hex?L(5,6):7;o.r=o.hex?9:L(8,10);o.src=k%3==2?2:1;o.tw=k%3==1?2:0;o.sym=k%4==0||k==9?1:0;o.loop=.1;o.sh=o.hex?(k==5?'anel':'full'):['full','','oval','','asas','','losango','','anel',''][k]||'full';o.lk=.1}
return o}
const rotl=(m,t,D)=>{t=((t%D)+D)%D;return((m<<t)|(m>>(D-t)))&((1<<D)-1)};
const pc=m=>{let c=0;for(;m;m&=m-1)c++;return c};
function gen(n){
const s=spec(n),R=rng(n*7919+331),D=s.hex?6:4,kx=(x,y)=>M.round(x*200)+','+M.round(y*200);
let cs=[];const H=s.hex?.8660254:1;
for(let r=0;r<s.r;r++){const C=s.hex&&r%2?s.c-1:s.c;for(let c=0;c<C;c++)cs.push({x:c-(C-1)/2,y:(r-(s.r-1)/2)*H})}
const mx=(s.c-1)/2||1,my=(s.r-1)/2*H||1;
cs=cs.filter(p=>SHP[s.sh](p.x/mx,p.y/my));
const link=()=>{const m=new Map(cs.map((p,i)=>[kx(p.x,p.y),i]));cs.forEach(p=>{p.nb=[];for(let d=0;d<D;d++){const j=m.get(kx(p.x+M.cos(d*TAU/D),p.y+M.sin(d*TAU/D)));p.nb.push(j===undefined?-1:j)}});return m};
link();
let best=[];const sn=new Set();
cs.forEach((_,i)=>{if(sn.has(i))return;const q=[i];sn.add(i);for(let h=0;h<q.length;h++)cs[q[h]].nb.forEach(j=>{if(j>=0&&!sn.has(j)){sn.add(j);q.push(j)}});if(q.length>best.length)best=q});
cs=best.sort((a,b)=>a-b).map(i=>cs[i]);
const map=link(),N=cs.length,shuf=a=>{for(let i=a.length-1;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const deg=new Array(N).fill(0),ad=cs.map(()=>new Set());
const put=(a,b)=>{if(ad[a].has(b))return;ad[a].add(b);ad[b].add(a);deg[a]++;deg[b]++};
const mir=i=>{const j=map.get(kx(-cs[i].x,cs[i].y));return j===undefined?-1:j};
const E=[];cs.forEach((p,a)=>p.nb.forEach(b=>{if(b>a)E.push([a,b])}));
const uf=cs.map((_,i)=>i),f=i=>{while(uf[i]!=i)i=uf[i]=uf[uf[i]];return i};
const ek=(a,b)=>a<b?a*N+b:b*N+a;let orb=[];const us=new Set();
E.forEach(([a,b])=>{if(us.has(ek(a,b)))return;us.add(ek(a,b));const o=[[a,b]];if(s.sym){const x=mir(a),y=mir(b);if(x>=0&&y>=0&&!us.has(ek(x,y))){us.add(ek(x,y));o.push([x,y])}}orb.push(o)});
shuf(orb);
if(s.dfs&&R()<s.dfs){const st=[R()*N|0],v=new Set(st);while(st.length){const a=st[st.length-1],o=cs[a].nb.filter(j=>j>=0&&!v.has(j));if(!o.length){st.pop();continue}const b=o[R()*o.length|0];v.add(b);put(a,b);st.push(b)}for(let i=1;i<N;i++)uf[f(i)]=f(0)}
else for(let ps=0;ps<2;ps++)for(const o of orb){if(!o.some(([a,b])=>f(a)!=f(b)))continue;if(!ps&&o.some(([a,b])=>deg[a]>=D-1-(D>4?1:0)||deg[b]>=D-1-(D>4?1:0)))continue;o.forEach(([a,b])=>{put(a,b);uf[f(a)]=f(b)})}
let src=[];const cen=i=>M.hypot(cs[i].x,cs[i].y);
const reach=(i,ba,bb)=>{const q=[i],v=new Set(q);for(let h=0;h<q.length;h++)ad[q[h]].forEach(j=>{if(v.has(j)||(q[h]==ba&&j==bb)||(q[h]==bb&&j==ba))return;v.add(j);q.push(j)});return v};
const mid=a=>a.sort((x,y)=>(deg[x]<2)-(deg[y]<2)||cen(x)-cen(y))[0];
let side=null;
if(s.src==2&&!s.sym){let bd=null,bv=-1;E.forEach(([a,b])=>{if(!ad[a].has(b))return;const v=reach(a,a,b),m=v.has(b)?0:M.min(v.size,N-v.size);if(m>bv){bv=m;bd=[a,b,v]}});
if(bd&&bv>=N*.25&&deg[bd[0]]>1&&deg[bd[1]]>1){const[a,b,v]=bd;ad[a].delete(b);ad[b].delete(a);deg[a]--;deg[b]--;side=v;
const ctr=L=>{let gx=0,gy=0;L.forEach(i=>{gx+=cs[i].x;gy+=cs[i].y});gx/=L.length;gy/=L.length;return L.sort((x,y)=>(deg[x]<2)-(deg[y]<2)||M.hypot(cs[x].x-gx,cs[x].y-gy)-M.hypot(cs[y].x-gx,cs[y].y-gy))[0]};
const A=[...v],B=cs.map((_,i)=>i).filter(i=>!v.has(i));src=[ctr(A),ctr(B)]}}
if(s.loop)orb.forEach(o=>{if(R()<s.loop&&o.every(([a,b])=>!ad[a].has(b)&&deg[a]<D-1&&deg[b]<D-1&&(!side||side.has(a)==side.has(b))))o.forEach(([a,b])=>put(a,b))});
if(!src.length){const all=cs.map((_,i)=>i);if(s.src==2){const a=all.filter(i=>deg[i]>1&&M.abs(cs[i].x)>=.9).sort((x,y)=>M.abs(cs[x].y)-M.abs(cs[y].y))[0],b=a===undefined?-1:mir(a);src=b>=0?[a,b]:[mid(all)]}else src=[mid(all)]}
cs.forEach((p,i)=>{p.sol=0;p.nb.forEach((j,d)=>{if(j>=0&&ad[i].has(j))p.sol|=1<<d});p.dg=deg[i];p.src=src.includes(i);p.g=i;p.lk=0;p.tw=0});
const triv=i=>rotl(cs[i].sol,1,D)==cs[i].sol;
const free=shuf(cs.map((_,i)=>i).filter(i=>!triv(i)));
cs.forEach((p,i)=>{if(triv(i))p.lk=2});
let nl=M.round(N*s.lk);while(nl-->0&&free.length>6)cs[free.pop()].lk=1;
for(let t=1;t<=s.tw;t++){const a=free.pop();let bi=free.findIndex(j=>!cs[a].nb.includes(j)&&!cs[j].src&&cs[j].dg==cs[a].dg);if(bi<0)bi=0;const b=free.splice(bi,1)[0];cs[b].g=a;cs[a].tw=cs[b].tw=t}
const gs={};cs.forEach((p,i)=>(gs[p.g]=gs[p.g]||[]).push(i));
const start=new Array(N).fill(0),ok=g=>gs[g].every(i=>rotl(cs[i].sol,start[g],D)==cs[i].sol);
for(const g in gs){if(cs[g].lk)continue;if(R()<s.mix||cs[g].tw){let gd=0;do start[g]=D-1-(R()*(D>4?3:3)|0);while(ok(g)&&gd++<20);if(D>4&&ok(g))start[g]=1}}
