<script id="nucleo">
'use strict';
// ============================================================ NÚCLEO: campo, fases, física e regras. Sem tela: dá para testar no Node.
// O campo tem medidas fixas (120 x 180 unidades). A tela só amplia; por isso girar o celular não muda nada no jogo.
const Nucleo = (() => {
  const W = 120, H = 180, COLS = 10, LIN = 12, CW = 11.2, CH = 6, X0 = 4, Y0 = 16, PY = 166, PH = 4.2, R = 2, TOTAL = 50;
  const LUGARES = ['Ateliê', 'Pátio', 'Fonte', 'Estação', 'Forno'];
  const CORES = ['Terracota', 'Ocre', 'Sálvia', 'Vinho'];                 // esmaltes; -1 = bola sem esmalte (marfim)
  const ITENS = { largo: 'Barra larga', tripla: 'Três bolas', lenta: 'Bola lenta', pincel: 'Pincel' };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  // sorteio com semente: a mesma fase sai sempre igual
  function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hash(a, b, c) { let h = Math.imul(a + 1, 374761393) ^ Math.imul(b + 7, 668265263) ^ Math.imul(c + 13, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  // dente de serra: em cada grupo de 10, a 5 e a 9 são difíceis e a 10 é muito difícil
  const dif = n => { const g = (n - 1) % 10 + 1; return g === 10 ? 2 : g === 5 || g === 9 ? 1 : 0; };
  // desenhos dos painéis (sempre simétricos, como um painel de azulejos): devolve a faixa de cor, -1 vazio, -2 biscoito
  const FAM = [[0, 1, 5, 2, 7, 3, 8, 6, 4, 9], [5, 2, 0, 8, 9, 1, 7, 3, 4, 6], [2, 7, 1, 4, 3, 0, 5, 9, 8, 6], [8, 3, 6, 0, 5, 2, 1, 7, 9, 4], [1, 6, 4, 9, 2, 8, 0, 5, 3, 7]];
  function forma(f, c, r, Rn) {
    const m = c < 5 ? c : 9 - c, meio = (Rn - 1) / 2;
    switch (f) {
      case 0: return r % 4 === 3 && m % 2 === 1 ? -1 : r;                                                   // faixas com respiros
      case 1: return (m + r) % 2;                                                                            // xadrez
      case 2: { const d = (4 - m) * .8 + Math.abs(r - meio); return d <= meio + 1.7 ? Math.floor(d / 1.3) : -1; }   // losango
      case 3: return r < 2 ? 0 : m < 2 ? 1 + (m + r) % 2 : r === Rn - 1 && m >= 3 ? 3 : -1;                  // arco
      case 4: { const o = Math.round(Math.sin(m * .9) * 1.3); return ((r + o) % 3 + 3) % 3 === 2 ? -1 : Math.floor((r + o + 3) / 3); }  // ondas
      case 5: return Math.min(m, r, Rn - 1 - r);                                                             // molduras
      case 6: return m % 2 === 0 ? m / 2 : r % 3 === 0 ? 3 : -1;                                              // colunas e travessas
      case 7: { const d = Math.hypot((c - 4.5) * .62, r - meio); return d <= meio + .9 ? Math.floor(d * .9) : -1; }  // flor
      case 8: return 4 - m <= r * .75 + .2 ? r % 3 : -1;                                                     // pirâmide
      default: return r === 0 || r === Rn - 1 || m === 0 ? 0 : (m + r) % 2 ? 1 : -2;                          // janela
    }
  }
  // monta a fase n: grade de 10 colunas, cada casa nula ou {k, cor, hp, item}
  //   k: 'a' azulejo esmaltado · 'b' biscoito (barro sem esmalte) · 'f' ferro (não quebra) · 'j' jarro de esmalte (pinta os vizinhos)
  function nivel(n) {
    const G = Math.floor((n - 1) / 10), g = (n - 1) % 10, d = dif(n), f = FAM[G][g], rnd = rng(n * 1013 + 7);
    const Rn = clamp(4 + Math.floor(G * .75) + Math.floor(g / 4) + d, 4, 9), nc = n <= 2 ? 2 : [2, 3, 3, 4, 4][G];
    const cores = Array.from({ length: nc }, (_, i) => (n + i) % 4);
    const pDuro = n === 1 ? 0 : G === 0 ? d * .12 : Math.min(.3, .05 * G + d * .1), pBisc = n <= 2 ? 0 : Math.min(.28, .08 + .04 * G);
    const cel = new Array(COLS * LIN).fill(null);
    for (let r = 0; r < Rn; r++) for (let c = 0; c < COLS; c++) {
      const b = forma(f, c, r, Rn); if (b === -1) continue; const m = c < 5 ? c : 9 - c;
      let x = { k: 'a', cor: cores[b % nc], hp: 1 };
      if (b === -2 || hash(n, m, r) < pBisc) x = { k: 'b', cor: -1, hp: 1 };
      if (hash(n + 50, m, r) < pDuro) x.hp = 2;
      cel[r * COLS + c] = x;
    }
    const lado = (fn) => { const l = []; for (let r = 0; r < Rn; r++) for (let m = 0; m < 5; m++) if (fn(cel[r * COLS + m], r, m)) l.push([r, m]); return l.sort((a, b) => hash(n + 9, a[0], a[1]) - hash(n + 9, b[0], b[1])); };
    const par = (r, m, fn) => { fn(cel[r * COLS + m]); if (cel[r * COLS + 9 - m] !== cel[r * COLS + m]) fn(cel[r * COLS + 9 - m]); };
    // ferro: aparece a partir da fase 6, em pares espelhados, nunca na fileira de baixo
    let nf = n < 6 ? 0 : Math.min(4, Math.floor(G * .6 + d * 1.2 + rnd())); if (f === 9 && n >= 6) nf += 1;
    for (const [r, m] of lado((x, r) => x && r < Rn - 1 && r > 0).slice(0, nf)) par(r, m, x => { x.k = 'f'; x.cor = -1; x.hp = 1; });
    // jarros de esmalte: a partir da fase 3
    const nj = n < 3 ? 0 : 1 + (G >= 2 ? 1 : 0) + (rnd() < .4 ? 1 : 0);
    for (const [r, m] of lado(x => x && x.k === 'a').slice(0, nj)) par(r, m, x => { x.k = 'j'; x.hp = 1; });
    // itens escondidos (caem quando o azulejo quebra)
    const tipos = ['largo', ...(n >= 3 ? ['pincel'] : []), ...(n >= 4 ? ['tripla'] : []), ...(n >= 7 ? ['lenta'] : [])];
    const livres = cel.map((x, i) => x && x.k !== 'f' && x.k !== 'j' ? i : -1).filter(i => i >= 0).sort((a, b) => hash(n + 77, a, 1) - hash(n + 77, b, 1));
    const ni = n === 1 ? 1 : Math.min(4, 1 + Math.floor(livres.length / 22));
    for (let i = 0; i < ni && i < livres.length; i++) cel[livres[i]].item = n === 1 ? 'largo' : tipos[Math.floor(hash(n, i, 99) * tipos.length)];
    // todo azulejo precisa ser alcançável: se o ferro fechar algum, o ferro vira biscoito
    for (let volta = 0; volta < 6; volta++) {
      const ok = new Uint8Array(COLS * LIN), fila = []; for (let c = 0; c < COLS; c++) { const i = (LIN - 1) * COLS + c; if (!cel[i] || cel[i].k !== 'f') { ok[i] = 1; fila.push(i); } }
      for (let c = 0; c < COLS; c++) if (!cel[c] || cel[c].k !== 'f') { ok[c] = 1; fila.push(c); }     // por cima do painel a bola passa livre
      while (fila.length) { const i = fila.pop(), c = i % COLS, r = (i / COLS) | 0; for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const cc = c + dc, rr = r + dr; if (cc < 0 || cc >= COLS || rr < 0 || rr >= LIN) continue; const j = rr * COLS + cc; if (!ok[j] && (!cel[j] || cel[j].k !== 'f')) { ok[j] = 1; fila.push(j); } } }
      const presos = cel.map((x, i) => x && x.k !== 'f' && !ok[i] ? i : -1).filter(i => i >= 0); if (!presos.length) break;
      for (const i of presos) for (const j of [i - 1, i + 1, i - COLS, i + COLS]) if (cel[j] && cel[j].k === 'f') { cel[j].k = 'b'; cel[j].hp = 1; }
    }
    const total = cel.filter(x => x && x.k !== 'f').length;
    return { n, lugar: G, dif: d, forma: f, linhas: Rn, cores, cel, total, vel: 96 + n * .42 + d * 6, raquete: 26 - n * .1 - d * 1.5, par: Math.round(25 + total * 1.2) };
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (P && !P.fim && !aberto) Telas.abrir('pausa'); Som.dormir(true); } else Som.dormir(false); });
  // vitrine: a abertura mostra o painel da fase atual atrás do título
  function vitrine() { const k = Math.min(N.TOTAL, D.fase); P = new N.Partida(k); Tela.nova(P); Som.lugar(P.F.lugar); pausado = true; Telas.hud(P); }
  requestAnimationFrame(quadro);
  return { comecar, vitrine, get P() { return P; }, get n() { return n; }, get pausado() { return pausado; }, pausar(v) { pausado = v; dedo = null; }, set aberto(v) { aberto = v; }, get aberto() { return aberto; }, SENS, set ritmo(v) { ritmo = v; } };
})();

// ============================================================ TELAS
const Telas = (() => {
  const D = Progresso.d, N = Nucleo, EST = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z"/></svg>';
  let pilha = [], ult = {};
  function mostra(id) { document.querySelectorAll('.tela').forEach(t => t.classList.toggle('on', t.id === id)); Jogo.aberto = id; if (id) Jogo.pausar(true); }
  const abrir = id => { pilha.push(id); mostra(id); if (id === 'mapa') mapa(); if (id === 'ajustes') ajustes(); if (id === 'abertura') Som.ligar(false); }, fechar = () => { pilha = []; mostra(''); }, trocar = id => { pilha = []; abrir(id); };
  function voltar() { pilha.pop(); const id = pilha[pilha.length - 1] || ''; if (!id) inicio(); else { mostra(id); if (id === 'mapa') mapa(); } }
  function inicio() { trocar('abertura'); Jogo.vitrine(); }
  function hud(P) { $('tFase').textContent = 'Fase ' + P.n; $('tLugar').textContent = N.LUGARES[P.F.lugar] + (P.F.dif === 2 ? ' · muito difícil' : P.F.dif ? ' · difícil' : ''); $('dica').textContent = ''; ult = {}; placar(P); somIcone(); }
  // placar: só mexe no que mudou
  function placar(P) {
    const b = P.bolas.find(x => !x.presa) || P.bolas[0], cor = b ? b.cor : -1, v = Math.max(3, P.vidas), q = `${P.vidas}/${v}`;
    if (ult.q !== q) { ult.q = q; let h = ''; for (let i = 0; i < Math.min(6, v); i++) h += `<i class="${i < P.vidas ? '' : 'foi'}"></i>`; $('bolas').innerHTML = h; $('bolas').setAttribute('aria-label', `${P.vidas} bolas`); }
    if (ult.p !== P.pontos) { ult.p = P.pontos; $('pontos').firstChild.nodeValue = P.pontos; }
    const pr = Math.round((P.total - P.restam) / P.total * 1000) / 10; if (ult.r !== pr) { ult.r = pr; $('barra').style.width = pr + '%'; }
    if (ult.c !== cor) { ult.c = cor; $('esmalte').firstChild.style.background = cor >= 0 ? Tela.COR[cor] : Tela.MARFIM; $('esmalte').lastChild.textContent = cor >= 0 ? 'Esmalte: ' + N.CORES[cor] : 'Sem esmalte'; }
  }
  function somIcone() { const b = $('bSom'), s = D.op.som; b.querySelector('.ligado').style.display = s ? '' : 'none'; b.querySelector('.mudo').style.display = s ? 'none' : ''; b.setAttribute('aria-label', s ? 'Desligar som' : 'Ligar som'); b.setAttribute('aria-pressed', s); }
  function mapa() {
    $('mResumo').textContent = `${Progresso.totalEstrelas} de ${N.TOTAL * 3} estrelas`; let h = '';
    N.LUGARES.forEach((l, g) => { let e = 0, b = ''; for (let i = 1; i <= 10; i++) { const f = g * 10 + i, q = D.estrelas[f] || 0, d = N.dif(f); e += q; b += `<button class="fs${f === Math.min(N.TOTAL, D.fase) ? ' atual' : ''}${d ? ' dura' : ''}${d === 2 ? ' dura2' : ''}" data-f="${f}" ${f > D.fase ? 'disabled' : ''} aria-label="Fase ${f}${d === 2 ? ', muito difícil' : d ? ', difícil' : ''}, ${q} estrelas">${f}<small>${'★'.repeat(q)}</small></button>`; } h += `<h3>${l}<small>${e} de 30 ★</small></h3><div class="grade">${b}</div>`; });
    $('mLista').innerHTML = h; setTimeout(() => { const a = document.querySelector('.fs.atual'); if (a) a.scrollIntoView({ block: 'center' }); }, 20);
  }
  function ajustes() { document.querySelectorAll('.op').forEach(b => b.setAttribute('aria-pressed', D.op[b.dataset.op])); }
  function vitoria(n, p, e) {
    $('vTit').textContent = n === N.TOTAL ? 'Oficina completa!' : e === 3 ? 'Sem perder nenhuma!' : 'Fase concluída!'; $('vEst').innerHTML = EST.repeat(3); [...$('vEst').children].forEach((s, i) => { if (i < e) setTimeout(() => { s.classList.add('on'); Som.estrela(i); vibra(12); }, 250 + i * 260); });
    $('vTxt').innerHTML = `<b>${p.pontos}</b> pontos · recorde ${D.recordes[n]}<br>${Math.round(p.tempo)} s · maior veio ${p.maiorVeio}${e < 3 ? '<br>3 estrelas: terminar sem perder bola' : ''}`;
    $('vProx').textContent = n === N.TOTAL ? 'Ver as fases' : 'Próxima'; trocar('vitoria');
  }
  function derrota(n, p) { $('dTit').textContent = p.restam <= 3 ? 'Foi por pouco!' : 'As bolas acabaram'; $('dTxt').innerHTML = `Faltaram <b>${p.restam}</b> de ${p.total} azulejos.`; trocar('derrota'); }
  const b = (id, f) => $(id).addEventListener('click', () => { Som.iniciar(); Som.botao(); f(); });
  const fases = () => { pilha = ['abertura']; abrir('mapa'); Jogo.vitrine(); };
  b('bJogar', () => Jogo.comecar(Math.min(N.TOTAL, D.fase))); b('bMapa', () => abrir('mapa')); b('bAjustes', () => abrir('ajustes'));
  const pausa = () => { if (Jogo.P && !Jogo.P.fim && !Jogo.aberto) abrir('pausa'); }; b('bPausa', pausa); b('bVolta', pausa);
  const continua = () => { fechar(); Jogo.pausar(false); }; b('pContinua', continua); b('pRecomeca', () => Jogo.comecar(Jogo.n)); b('pFases', fases); b('pAjustes', () => abrir('ajustes'));
  b('vProx', async () => { const n = Jogo.n; await Ganchos.entreFases(n); if (n >= N.TOTAL) fases(); else Jogo.comecar(n + 1); }); b('vDeNovo', () => Jogo.comecar(Jogo.n)); b('vFases', fases); b('dDeNovo', () => Jogo.comecar(Jogo.n)); b('dFases', fases);
  b('bSom', () => { D.op.som = !D.op.som; Progresso.salvar(); Som.volume(); somIcone(); if (D.op.som) Som.botao(); });
  document.querySelectorAll('[data-volta]').forEach(x => x.addEventListener('click', () => { Som.botao(); voltar(); })); document.querySelectorAll('.op').forEach(x => x.addEventListener('click', () => { D.op[x.dataset.op] = !D.op[x.dataset.op]; Progresso.salvar(); Som.iniciar(); Som.volume(); ajustes(); somIcone(); Som.botao(); if (x.dataset.op === 'vibra') vibra(30); }));
  $('mLista').addEventListener('click', e => { const q = e.target.closest('.fs'); if (q && !q.disabled) { Som.iniciar(); Som.botao(); Jogo.comecar(+q.dataset.f); } });
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (Jogo.aberto === 'pausa') continua(); else if (!Jogo.aberto) pausa(); else if (Jogo.aberto && !['abertura', 'vitoria', 'derrota'].includes(Jogo.aberto)) voltar(); } });
  // o navegador só libera som depois de um toque de verdade
  for (const t of ['pointerdown', 'touchend', 'click', 'keydown']) document.addEventListener(t, () => Som.iniciar(), { passive: true, capture: true });
  return { abrir, fechar, trocar, voltar, inicio, hud, placar, vitoria, derrota, somIcone };
})();

// ============================================================ ABRIR
(() => {
  try {
    Tela.medir(); addEventListener('resize', () => Tela.medir()); if (window.ResizeObserver) new ResizeObserver(() => Tela.medir()).observe($('area'));
    Telas.somIcone(); Telas.inicio(); $('carga').remove();
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__glaze = { Nucleo, Progresso, Som, Tela, Jogo, Telas, Eventos, Ganchos };
  } catch (e) { console.error(e); $('carga').textContent = 'Não deu para abrir o jogo. Atualize o navegador e tente de novo.'; }
})();
</script>
</body>
