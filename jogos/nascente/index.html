<!doctype html>
<html lang="pt-BR">
<!--
  NASCENTE: quebra-cabeça calmo de aquedutos, em 3D, num arquivo só.

  MAPA DO ARQUIVO (procure pelos títulos com "====")
     1. FASES E TEMAS ........ o lugar para criar fases novas e climas novos
     2. PEÇAS ................ tipos de peça e como cada símbolo do mapa vira peça
     3. REGRAS DA ÁGUA ....... por onde a água corre (não depende do 3D)
     4. PROGRESSO SALVO ...... localStorage
     5. SOM .................. tudo sintetizado com Web Audio
     6. BASE 3D .............. renderizador, luz, névoa, materiais
     7. FORMAS ............... aquedutos, casas, hortas, poços, pedras
     8. ILHA ................. relevo, plantas e o "mapa de vida"
     9. CÂMERA
    10. JOGO ................. montar fase, girar, desfazer, dica, conclusão
    11. TELA E CONTROLES ..... botões, toque, mouse, teclado
    12. LAÇO PRINCIPAL
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe5dc">
<title>Nascente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%232f8f9d' d='M12 2c4 5 7 9 7 13a7 7 0 0 1-14 0c0-4 3-8 7-13z'/></svg>">
<style>
  :root { --nevoa: #dfe5dc; --tinta: #2d3a37; --vidro: rgba(255,255,255,.34); --risco: rgba(45,58,55,.16); --acento: #2b7f8c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--nevoa); color: var(--tinta);
    font: 400 16px/1.45 "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  body { transition: color 1s; user-select: none; -webkit-user-select: none; }
  canvas#tela { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  canvas#tela.peca { cursor: pointer; } canvas#tela.arrasta { cursor: grabbing; }

  /* ---- cabeçalho ---- */
  .topo { position: fixed; left: 0; right: 0; top: 0; padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none; }
  .topo > * { pointer-events: auto; }
  .fase-atual { pointer-events: none; min-width: 0; margin-right: auto; }
  .topo > .redondo { flex: none; color: inherit; }
  .fase-atual h1 { margin: 0; font-size: clamp(19px, 2.6vw, 26px); font-weight: 400; line-height: 1.15; text-wrap: balance; }
  .fase-atual p { margin: 5px 0 0; font-size: 14px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .gotas { display: inline-flex; gap: 4px; }
  .gotas i { width: 10px; height: 10px; border-radius: 50% 50% 50% 0; transform: rotate(135deg); border: 1.4px solid currentColor; opacity: .55; transition: background .8s, border-color .8s, opacity .8s; }
  .gotas i.cheia { background: var(--acento); border-color: var(--acento); opacity: 1; }
  .som { display: flex; align-items: center; gap: 6px; }
  .som input { width: 84px; accent-color: var(--acento); opacity: .75; height: 24px; margin: 0; cursor: pointer; }

  /* ---- botões ---- */
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  .redondo { position: relative; width: 46px; height: 46px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: var(--vidro); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .25s, transform .25s, opacity .25s; }
  .redondo svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .redondo:active { transform: scale(.94); }
  .redondo:disabled { opacity: .38; cursor: default; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }
  .barra { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; pointer-events: none; transition: opacity .6s; }
  .barra button { pointer-events: auto; }
  .barra.some { opacity: 0; visibility: hidden; transition: opacity .6s, visibility 0s .6s; }
  .redondo[data-nome]::after { content: attr(data-nome); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); font-size: 13px; white-space: nowrap; padding: 3px 10px; border-radius: 6px; background: rgba(38,50,47,.86); color: #f4f1e8; opacity: 0; pointer-events: none; transition: opacity .2s; }
  @media (hover: hover) {
    .redondo:not(:disabled):hover { background: rgba(255,255,255,.62); color: #2d3a37; }
    .redondo[data-nome]:hover::after { opacity: 1; }
  }

  /* ---- avisos e conclusão ---- */
  .aviso { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); width: fit-content; max-width: min(90vw, 460px); text-align: center; text-wrap: balance;
    font-size: 16px; line-height: 1.3; padding: 7px 18px; border-radius: 18px; background: rgba(250,248,240,.82); color: #2d3a37; opacity: 0; transition: opacity .7s; pointer-events: none; }
  .aviso.ver { opacity: 1; }
  .fim { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateY(14px); text-align: center; opacity: 0; visibility: hidden; transition: opacity 1.2s, transform 1.2s, visibility 0s 1.2s; width: fit-content; max-width: 92vw;
    padding: 16px 26px 18px; border-radius: 18px; background: rgba(250,248,240,.82); color: #2d3a37; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .fim.ver { opacity: 1; visibility: visible; transform: none; transition: opacity 1.2s, transform 1.2s; }
  .fim h2 { margin: 0; font-weight: 400; font-size: 23px; } .fim p { margin: 2px 0 12px; font-size: 15px; text-wrap: balance; }
  .fim .acoes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .cheio { position: relative; overflow: hidden; min-height: 44px; padding: 8px 22px; border-radius: 999px; background: #27646e; color: #fbf8ee; isolation: isolate; }
  .cheio i { position: absolute; inset: 0; background: #347d88; transform: scaleX(0); transform-origin: left; z-index: -1; }
  .leve { min-height: 44px; padding: 8px 18px; border-radius: 999px; } .leve:hover { background: rgba(45,58,55,.08); }
  .fim.quieto { padding: 0; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; } .fim.quieto h2, .fim.quieto p, .fim.quieto .leve { display: none; }

  /* ---- escolha de fases ---- */
  dialog { border: 0; padding: 0; margin: auto; width: min(94vw, 640px); max-height: min(86vh, 720px); border-radius: 20px; background: #f6f3e9; color: #2d3a37; box-shadow: 0 24px 70px rgba(30,40,40,.28); overscroll-behavior: contain; scrollbar-width: thin; }
  dialog::backdrop { background: rgba(60,75,72,.38); }
  .painel { padding: 22px clamp(16px, 4vw, 28px) 26px; }
  .painel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .painel h2 { font-weight: 400; margin: 0; font-size: 24px; } .painel header + p { margin: 0 0 16px; font-size: 15px; }
  .painel .redondo { background: rgba(45,58,55,.07); }
  .fases { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px 18px; list-style: none; margin: 0; padding: 0; }
  .fases button { width: 100%; min-height: 54px; display: grid; grid-template-columns: 26px 1fr 16px; align-items: center; gap: 8px; text-align: left; padding: 6px 10px; border-radius: 12px; }
  .fases button:hover { background: rgba(43,127,140,.1); } .fases .aqui { background: rgba(43,127,140,.15); }
  .fases b { font-weight: 400; opacity: .7; font-variant-numeric: tabular-nums; } .fases small { display: block; opacity: .75; font-size: 13px; line-height: 1.2; }
  .fases .gotas i { width: 12px; height: 12px; opacity: .35; } .fases .gotas i.cheia { opacity: 1; }

  #veu { position: fixed; inset: 0; background: var(--nevoa); transition: opacity 1s ease; pointer-events: none; display: grid; place-items: center; }
  #veu p { font-size: 18px; max-width: 80vw; text-align: center; transition: opacity .5s; }
  @media (max-width: 560px) { .barra { gap: 8px; } .som input { width: 66px; } .redondo { width: 44px; height: 44px; } .fim { padding: 14px 16px 16px; } .fim .acoes { gap: 4px; } .leve, .cheio { padding: 8px 14px; } }
  @media (max-height: 430px) {
    .barra { flex-direction: column; left: auto; right: max(14px, env(safe-area-inset-right)); bottom: 10px; gap: 6px; }
    .redondo { width: 40px; height: 40px; } .som { margin-right: 56px; } .aviso { bottom: 12px; } .redondo[data-nome]::after { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; } }
</style>
</head>
<body>
<canvas id="tela" tabindex="0" aria-label="Tabuleiro do jogo. Use as setas para escolher uma peça e a barra de espaço para girar."></canvas>

<div class="topo">

<div class="barra" id="barra">
  <button id="b-fases" class="redondo" data-nome="Fases" aria-label="Escolher fase"><svg viewBox="0 0 24 24"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
  <button id="b-desfazer" class="redondo" data-nome="Desfazer" aria-label="Desfazer o último giro"><svg viewBox="0 0 24 24"><path d="M8 5 4 9l4 4"/><path d="M4 9h10a5 5 0 0 1 0 10H9"/></svg></button>
  <button id="b-dica" class="redondo" data-nome="Dica" aria-label="Ver uma dica"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/><path d="M9 14a3 3 0 0 0 3 3"/></svg></button>

</div></dialog>

<script type="module">
// O Three.js vem da internet (CDN). No site com modo offline ativo, usa primeiro a cópia guardada no aparelho.
const CDN = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js', COPIA = '../../lib/three/three.module.min.js';
const [primeira, segunda] = navigator.serviceWorker?.controller ? [COPIA, CDN] : [CDN, COPIA];
let THREE;
try { THREE = await import(primeira); }
catch {
  try { THREE = await import(segunda); }
  catch (e) { document.getElementById('veu-texto').textContent = 'Não consegui carregar a parte 3D. Ligue a internet e abra de novo.'; throw e; }
}

const $ = id => document.getElementById(id);
const limitar = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const misturar = (a, b, t) => a + (b - a) * t;
const suave = (a, b, v) => { const t = limitar((v - a) / (b - a)); return t * t * (3 - 2 * t); };
// sorteio que sempre dá a mesma sequência para a mesma semente (cada fase fica igual em todo aparelho)
const sorteador = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const CALMO = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ============================================================ 1. FASES E TEMAS
/*
  COMO CRIAR UMA FASE: desenhe o mapa JÁ RESOLVIDO. O jogo embaralha sozinho.
    ─ │          canal reto          ┌ ┐ └ ┘     curva
    ├ ┤ ┬ ┴      bifurcação          ┼           encruzilhada (reparte para os 4 lados)
    +            sifão: dois canais se cruzam sem misturar
    ╱ ╲          curvas gêmeas: dois canais separados na mesma peça
    peça!        com "!" a peça é fixa (não gira)
    N            nascente            V H R P     vila, horta, reservatório, poço
    Depois de N V H R P vem o lado da boca do canal:  ^ norte   > leste   v sul   < oeste
    .            terreno livre
  alturas (opcional): um dígito por casa. A água desce degraus, mas nunca sobe.
  Peças que a água não usa no mapa resolvido viram distração, sem problema.
*/
const FASES = [
  { nome: 'Primeiro fio d’água', tema: 'manha', dica: 'Toque nas peças para girar e levar a água até a horta', mapa: `
    N> ─  ┐  .
    .  .  │  .
    .  .  └  H<` },
  { nome: 'A volta do morro', tema: 'primavera', mapa: `
    .  ┌  ─  ┐  .
    N> ┘  .  │  .
    .  .  .  └  V<` },
  { nome: 'Dois vizinhos', tema: 'nevoa', dica: 'Uma bifurcação reparte a água em dois caminhos', mapa: `
    .  ┌  ─  H<
    N> ┤  .  .
    .  │  .  .
    .  └  ─  V<` },
  { nome: 'Degraus de pedra', tema: 'tarde', dica: 'A água desce os degraus, mas não sobe', mapa: `
    N> ─  ┐  .  .
    .  .  │  .  .
    .  .  └  ┬  H<
    .  .  .  │  .
    .  .  .  └  R<`, alturas: `
    22211
    22211
    11111
    10000
    00000` },
  { nome: 'Pedras antigas', tema: 'manha', dica: 'As peças de pedra escura são fixas: construa em volta delas', mapa: `
    .  P> ─  ┐  .
    N> ─! ┬  ┤! .
    .  H> ┘  │  .
    .  .  .  └  V<` },
  { nome: 'Águas que se cruzam', tema: 'lua', dica: 'No sifão, uma água passa por baixo da outra sem misturar', mapa: `
    .  .  Nv .  .
    .  .  │  ┐  .
    N> ─  +! ─  ┐
    .  └  │  .  │
    .  H> ┘  .  V^` },
  { nome: 'Curvas gêmeas', tema: 'primavera', dica: 'As curvas gêmeas levam duas águas separadas na mesma peça', mapa: `
    .  ┌  ─  ┐  .
    N> ╱  ─  ╲  V<
    .  │  .  │  .
    .  N^ .  H^ .` },
  { nome: 'Escada de cascatas', tema: 'tarde', mapa: `
    N> ─  ┬  ─  ┐  .
    .  .  │  .  └  H<
    .  P> ┤  .  .  .
    .  .  └  ┬! ─  V<
    .  .  .  R^ .  .`, alturas: `
    333222
    322222
    222111
    211111
    111000` },
  { nome: 'O jardim de dentro', tema: 'entardecer', mapa: `
    .  V> ┬  ─  H<
    .  ┐  │  ┌  .
    N> ─  ┼! ─  P<
    .  ┘  │  .  Rv
    .  .  └  ─  ┘` },
  { nome: 'Dois rios', tema: 'nevoa', mapa: `
    .  Nv .  .  .  .
    .  ├  ─  ┐  .  .
    .  │  ┌  ╲  ─  V<
    N> +! ┘  │  ┘  .
    .  │  H> ┴  ─  P<
    .  └  ─  R< .  .` },
  { nome: 'Encosta das oliveiras', tema: 'tarde', mapa: `
    .  .  Nv .  .  .  .
    H> ─  ┼! ─  ┐  .  .
    .  .  │  .  ├  ─  V<
    .  ┌  ┘  .  │  .  .
    P> ┴  ─  R< └  ─  H<`, alturas: `
    3333322
    2232222
    2222111
    2111111
    1100000` },
  { nome: 'O vale inteiro', tema: 'entardecer', mapa: `
    .  .  .  Nv .  .  .
    .  ┌  ─  ┼! ─  ┐  .
    .  V^ .  │  .  ├  H<
    N> ─  ─  +! ─  ╲  P<
    .  .  .  │  .  │  .
    .  ┌  ─  ┤  .  ├  H<
    .  H^ .  V^ .  R^ .`, alturas: `
    3333333
    2223222
    2122222
    2222221
    1111111
    1111111
    0000000` },
];

// Climas: cores da névoa, da luz e do verde que nasce. Cada fase aponta para um deles.
const TEMAS = {
  manha:      { nevoa: '#dbe3db', longe: '#aebfba', sol: '#fff0d4', forca: 2.7, ceu: '#dceaf0', solo: '#94815f', verde: '#75934b', seco: '#c2aa78', flores: ['#f4ead6', '#dfa39b', '#c4b3dc', '#f0d58c'], angulo: .7, tinta: '#2d3a37' },
  primavera:  { nevoa: '#dde6d0', longe: '#aec0a2', sol: '#fff3d0', forca: 2.6, ceu: '#e3f0e6', solo: '#8d8458', verde: '#6f9a4e', seco: '#c4b07a', flores: ['#f3c6cf', '#fbf2e2', '#e9aab8', '#d9c0ea'], angulo: .35, tinta: '#2f3b30' },
  nevoa:      { nevoa: '#cdd9da', longe: '#9db1b5', sol: '#eef4f2', forca: 2.1, ceu: '#d8e6ee', solo: '#7f8272', verde: '#5f8a5c', seco: '#b5a988', flores: ['#e9eef2', '#a9b9e0', '#cfd8ee', '#f1e6c4'], angulo: .2, tinta: '#28383c' },
  tarde:      { nevoa: '#ecdabb', longe: '#cfae86', sol: '#ffd599', forca: 2.9, ceu: '#f3e3cc', solo: '#9c7a50', verde: '#85934a', seco: '#cda873', flores: ['#f7e3a6', '#e8a36c', '#fbf0da', '#c98b86'], angulo: 1.2, tinta: '#423421' },
  entardecer: { nevoa: '#dcc3c0', longe: '#b294a0', sol: '#ffc49a', forca: 2.6, ceu: '#d9c6dc', solo: '#98795f', verde: '#728c5a', seco: '#bf9f7c', flores: ['#f6dcd2', '#d59ab4', '#b9a5d6', '#f2c79c'], angulo: 2, tinta: '#3d2d36' },
  lua:        { nevoa: '#46566d', longe: '#35435a', sol: '#c4d6fb', forca: 1.9, ceu: '#8fa5cc', solo: '#5a5c5c', verde: '#5d8a6e', seco: '#9c937f', flores: ['#e6ecfb', '#b5bff0', '#cfe3f0', '#e8dcc0'], angulo: .5, tinta: '#e9eef6', noite: true },
};

// ============================================================ 2. PEÇAS
// Lados: 0 norte (−z), 1 leste (+x), 2 sul (+z), 3 oeste (−x). Girar = somar 1 (sentido do relógio).
const DX = [0, 1, 0, -1], DZ = [-1, 0, 1, 0];

// Cada tipo lista seus "canais". Um canal é um grupo de lados ligados entre si.
// PEÇA NOVA: acrescente aqui, dê um símbolo em SIMBOLOS e, se for preciso, uma forma em formaPeca (seção 7).
const TIPOS = {
  reto:  [[0, 2]],
  curva: [[0, 1]],
  te:    [[0, 1, 2]],
  cruz:  [[0, 1, 2, 3]],
  sifao: [[1, 3], [0, 2]],          // o primeiro canal passa por cima, o segundo por baixo
  dupla: [[0, 1], [2, 3]],
};
// símbolo do mapa -> [tipo, giro]
const SIMBOLOS = {
  '│': ['reto', 0], '─': ['reto', 1], '└': ['curva', 0], '┌': ['curva', 1], '┐': ['curva', 2], '┘': ['curva', 3],
  '├': ['te', 0], '┬': ['te', 1], '┤': ['te', 2], '┴': ['te', 3], '┼': ['cruz', 0], '+': ['sifao', 0], '╲': ['dupla', 0], '╱': ['dupla', 1],
};
const LUGARES = { N: 'nascente', V: 'vila', H: 'horta', R: 'reservatorio', P: 'poco' };
const LADOS = { '^': 0, '>': 1, 'v': 2, '<': 3 };
const giroDe = (lado, giro) => ((lado + giro) % 4 + 4) % 4;
// "assinatura" da posição: duas rotações que dão o mesmo desenho têm a mesma assinatura
const assinatura = (tipo, giro) => TIPOS[tipo].map(g => g.map(l => giroDe(l, giro)).sort().join('')).sort().join('|');

// ============================================================ 3. REGRAS DA ÁGUA (sem 3D)
function lerFase(indice) {
  const def = FASES[indice];
  const linhas = def.mapa.trim().split('\n').map(l => l.trim().split(/\s+/));
  const alt = def.alturas ? def.alturas.trim().split('\n').map(l => [...l.trim()].map(Number)) : null;
  const larg = linhas[0].length, prof = linhas.length, sorte = sorteador(1000 + indice * 77);
  const F = { indice, def, larg, prof, alt: (x, z) => alt ? alt[z][x] : 0, celulas: [], grade: [] };
  linhas.forEach((linha, z) => {
    if (linha.length !== larg) throw new Error(`Fase ${indice + 1}: a linha ${z + 1} tem tamanho diferente`);
    linha.forEach((t, x) => {
      const i = z * larg + x;
      F.grade[i] = null;
      if (t === '.') return;
      const c = { i, x, z, h: F.alt(x, z), giro: 0, girando: false };
      if (LUGARES[t[0]]) { c.tipo = LUGARES[t[0]]; c.lugar = true; c.fixa = true; c.lado = LADOS[t[1]]; c.nos = [{ lados: [c.lado] }]; }
      else if (SIMBOLOS[t[0]]) {
        [c.tipo, c.certo] = SIMBOLOS[t[0]]; c.fixa = t[1] === '!';
        c.nos = TIPOS[c.tipo].map(g => ({ lados: g }));

      c.destino = !!c.lugar && c.tipo !== 'nascente';

  for (const c of F.celulas) if (!c.lugar) c.giro = c.certo;
  const ordem = correr(F);
  F.resolvido = completa(F);
  F.caminho = [...new Set(ordem.map(n => n.c))].filter(c => !c.fixa);
  // embaralha até ficar longe da solução
  do for (const c of F.celulas) if (!c.lugar && !c.fixa) {

    c.giro = outros.length && sorte() < .85 ? outros[sorte() * outros.length | 0] : sorte() * 4 | 0;

  for (const c of F.celulas) c.inicio = c.giro;

}

// Para onde vai a água que sai de um nó por um lado do mundo? Devolve o nó vizinho ou null.
function vizinho(F, no, lado) {
  const c = no.c, x = c.x + DX[lado], z = c.z + DZ[lado];
  if (x < 0 || z < 0 || x >= F.larg || z >= F.prof) return null;
  const v = F.grade[z * F.larg + x];
  if (!v || v.girando || v.h > c.h) return null;            // água não sobe degrau
  return v.nos.find(n => n.lados.some(l => giroDe(l, v.giro) === (lado + 2) % 4)) || null;
}
// Percorre a água a partir das nascentes. Marca alcance, pai e lado de entrada; devolve os nós em ordem.
function correr(F) {
  const fila = [];
  for (const c of F.celulas) for (const n of c.nos) {
    n.alcance = c.tipo === 'nascente'; n.pai = null; if (n.alcance) fila.push(n);
  }
  for (let k = 0; k < fila.length; k++) {
    const n = fila[k];
    if (n.c.girando || n.c.destino) continue;
    for (const l of n.lados) {

      if (!v || v.alcance || v.c.tipo === 'nascente') continue;
      v.alcance = true; v.pai = n; v.entradaNova = giroDe(lado + 2, -v.c.giro); fila.push(v);
    }

}
const completa = F => F.celulas.every(c => !c.destino || c.nos[0].alcance);
