<style>
/* ============================================================ APARÊNCIA */
:root { --osso:#efe6d6; --osso2:#b9ad9b; --tinta:#14110f; --painel:rgba(22,18,16,.86); --ouro:#e3b457; --linha:rgba(239,230,214,.14);
  --serifa:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --corpo:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
[hidden] { display:none !important; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--tinta); color:var(--osso); font-family:var(--corpo);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; position:fixed; inset:0; width:100%; }
#fundo,#tela { position:absolute; inset:0; width:100%; height:100%; }
#tela { z-index:3; pointer-events:none; }
#app { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; touch-action:none;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); }
#painel { width:100%; max-width:600px; margin:0 auto; }
.barra { display:flex; align-items:center; gap:8px; }
.barra h1 { flex:1; margin:0; font:600 17px/1.15 var(--serifa); text-align:center; }
.barra h1 small { display:block; font:400 12px/1.3 var(--corpo); color:var(--osso2); }
.ic { width:44px; height:44px; border-radius:12px; border:1px solid var(--linha); background:var(--painel); color:var(--osso); display:grid; place-items:center; padding:0; cursor:pointer; flex:none; }
.ic:active { transform:scale(.93); }
.ic svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.placar { display:flex; align-items:stretch; gap:8px; margin-top:8px; }
.movs { width:78px; border-radius:14px; background:var(--painel); border:1px solid var(--linha); text-align:center; padding:6px 4px; flex:none; }
.movs b { display:block; font:700 30px/1 var(--serifa); font-variant-numeric:tabular-nums; }
.movs span { font-size:11.5px; color:var(--osso2); }
.movs.poucos { border-color:#d9663f; } .movs.poucos b { color:#ff9a6b; }
.metas { flex:1; display:flex; justify-content:center; align-items:center; gap:4px 14px; flex-wrap:wrap; border-radius:14px; background:var(--painel); border:1px solid var(--linha); padding:6px 8px; min-height:60px; }
.meta { display:flex; align-items:center; gap:6px; font:700 20px/1 var(--serifa); font-variant-numeric:tabular-nums; }
.meta img { width:36px; height:36px; display:block; }
.meta.feita { color:var(--ouro); }
.meta.pula img { animation:pula .22s; }
@keyframes pula { 40% { transform:scale(1.22); } }
.pontos { width:84px; border-radius:14px; background:var(--painel); border:1px solid var(--linha); text-align:center; padding:6px 4px; flex:none; }
.pontos b { display:block; font:700 20px/30px var(--serifa); font-variant-numeric:tabular-nums; }
.pontos span { font-size:11.5px; color:var(--osso2); }
.prog { margin-top:8px; height:12px; border-radius:8px; background:rgba(10,8,7,.7); border:1px solid var(--linha); overflow:hidden; }
.prog i { display:block; height:100%; width:0; border-radius:8px; background:linear-gradient(90deg,#a9772c,var(--ouro)); transition:width .25s; }
#dica { min-height:22px; margin-top:6px; text-align:center; font-size:14.5px; line-height:1.35; color:var(--osso); text-shadow:0 1px 3px #000; }
#area { flex:1; min-height:0; width:100%; max-width:760px; margin:4px auto 0; cursor:pointer; }
/* celular deitado: painel ao lado do tabuleiro */
@media (orientation:landscape) and (max-height:560px) {
  #app { flex-direction:row; gap:10px; } #painel { width:250px; margin:0; } #area { margin:0 auto; }
  .placar { flex-wrap:wrap; } .metas { order:3; flex-basis:100%; } .movs,.pontos { flex:1; }
}
/* telas por cima */
.tela { position:absolute; inset:0; z-index:5; display:none; background:rgba(10,8,7,.62); padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); overflow:auto; touch-action:pan-y; overscroll-behavior:contain; }
.tela.on { display:flex; animation:surge .18s; }
@keyframes surge { from { opacity:0; } }
.caixa { margin:auto; width:100%; max-width:380px; background:#1d1815; border:1px solid var(--linha); border-radius:20px; padding:22px 20px; text-align:center; box-shadow:0 18px 60px rgba(0,0,0,.6); }
.caixa h2 { margin:0 0 6px; font:700 30px/1.1 var(--serifa); }
.caixa p { margin:6px 0 0; color:var(--osso2); font-size:16px; line-height:1.45; }
.bt { display:block; width:100%; min-height:54px; margin-top:12px; border-radius:15px; border:1px solid var(--linha); background:#2a231f; color:var(--osso); font:600 18px/1.2 var(--corpo); cursor:pointer; }
.bt.pri { background:linear-gradient(#e9bf68,#c18f38); color:#241803; border-color:#f0cf88; font-size:20px; min-height:60px; }
.bt:active { transform:scale(.97); }
.estrelas { display:flex; justify-content:center; gap:10px; margin:10px 0 4px; }
.estrelas svg { width:58px; height:58px; fill:#332b26; stroke:#50453c; stroke-width:1.4; }
.estrelas svg.on { fill:var(--ouro); stroke:#fbe3ab; animation:estrela .38s cubic-bezier(.2,1.7,.4,1); }
@keyframes estrela { from { transform:scale(0) rotate(-40deg); } }
.linha2 { display:flex; gap:10px; } .linha2 .bt { margin-top:10px; }
.op { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:50px; margin-top:8px; padding:0 16px; border-radius:13px; border:1px solid var(--linha); background:#26201c; color:var(--osso); font:500 17px var(--corpo); cursor:pointer; }
.op b { width:46px; height:26px; border-radius:20px; background:#443a33; position:relative; transition:.15s; } .op b::after { content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:var(--osso); left:3px; top:3px; transition:.15s; }
.op[aria-pressed=true] b { background:#b98835; } .op[aria-pressed=true] b::after { left:23px; }
.falta { display:flex; justify-content:center; gap:16px; margin:14px 0 4px; }
/* abertura e mapa */
#mapa { background:rgba(10,8,7,.5); }
#abertura { background:linear-gradient(rgba(10,8,7,.25),rgba(10,8,7,.8)); }
.capa { margin:auto; width:100%; max-width:420px; text-align:center; }
.capa h2 { margin:0; font:700 clamp(58px,18vw,88px)/.95 var(--serifa); letter-spacing:-.01em; text-shadow:0 4px 30px #000; }
.capa p { margin:8px 0 18px; font-size:18px; color:var(--osso); text-shadow:0 1px 6px #000; }
.capa .fila { display:flex; justify-content:center; gap:4px; margin:20px 0; } .capa .fila img { width:15%; max-width:60px; }
.capa a { display:inline-block; margin-top:18px; padding:10px; color:var(--osso2); font-size:15px; }
.mapa { margin:0 auto; width:100%; max-width:460px; }
.mapa h3 { margin:22px 0 10px; font:600 21px var(--serifa); display:flex; justify-content:space-between; align-items:baseline; } .mapa h3 small { font:400 14px var(--corpo); color:var(--osso2); }
.grade { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.fs { aspect-ratio:1; border-radius:14px; border:1px solid var(--linha); background:var(--painel); color:var(--osso); font:700 21px var(--serifa); cursor:pointer; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
.fs small { font-size:12px; letter-spacing:1px; color:var(--ouro); height:14px; } .fs.atual { border-color:var(--ouro); box-shadow:0 0 0 2px var(--ouro) inset; } .fs:disabled { opacity:.38; cursor:default; }
.vh { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
:focus-visible { outline:3px solid var(--ouro); outline-offset:2px; }
@media (max-height:640px) and (orientation:portrait) { .movs b { font-size:25px; } .meta img { width:30px; height:30px; } .metas { min-height:50px; } #dica { font-size:13px; min-height:18px; } }
</style>

<section class="tela" id="abertura"><div class="capa"><h2>Gem<br>Shatter</h2><p>Toque em pedras iguais que se encostam.</p><div class="fila" id="fila"></div>

<!-- ============================================================
     1. NÚCLEO: regras e fases, sem tela nem som.
     Pode rodar sozinho no Node (ferramentas/gem-shatter/calibrar.mjs).
     ============================================================ -->
<script id="nucleo">
'use strict';
const Nucleo = (() => {
  const COR = 'cor', ESP = 'esp', PEDRA = 'pedra', GEODO = 'geodo';
  const MIN_GRUPO = 2, MIN_RESSONA = 4;             // grupo mínimo para quebrar; grupo que ressoa sozinho ao cair
  const especialDe = n => n >= 9 ? 'p' : n >= 7 ? 'b' : n >= 5 ? 'l' : null;   // prisma, carga, broca
  const GALERIAS = ['Boca da mina', 'Lago fundo', 'Gruta violeta', 'Veio dourado', 'Coração da terra'];

  // ---------- desenhos usados para espalhar obstáculos ----------
  const meio = n => (n - 1) / 2;
  const REG = {
    base1: (x, y, W, H) => y >= H - 1, base2: (x, y, W, H) => y >= H - 2, base3: (x, y, W, H) => y >= H - 3,
    cantos: (x, y, W, H) => (x < 2 || x >= W - 2) && y >= H - 2,
    lados: (x, y, W, H) => (x < 1 || x >= W - 1) && y >= 3,
    pilares: (x, y, W, H) => x % 3 === 1 && y >= H - 4,
    degrau: (x, y, W, H) => y >= H - 1 - Math.min(x, W - 1 - x),
    vale: (x, y, W, H) => y >= H - 4 + Math.min(x, W - 1 - x),
    centro: (x, y, W, H) => Math.abs(x - meio(W)) <= 1.5 && Math.abs(y - meio(H)) <= 1.5,
    anel: (x, y, W, H) => { const d = Math.max(Math.abs(x - meio(W)), Math.abs(y - meio(H))); return d > 1.4 && d <= 2.5; },
    cruz: (x, y, W, H) => Math.abs(x - meio(W)) < 1 || Math.abs(y - meio(H)) < 1,
    xis: (x, y, W, H) => { const a = Math.abs(x - meio(W)), b = Math.abs(y - meio(H)); return Math.abs(a - b) < .6; },
    faixa: (x, y, W, H) => y === Math.floor(H * .6),
    duas: (x, y, W, H) => y === Math.floor(H * .45) || y === H - 2,
    coluna: (x, y, W) => Math.abs(x - meio(W)) < 1,
    xadrez: (x, y, W, H) => (x + y) % 2 === 0 && y >= H - 4,
    salpico: (x, y, W, H) => (x * 2 + y * 3) % 7 === 0 && y > 1,
    baixo: (x, y, W, H) => y >= Math.floor(H / 2), tudo: () => true,
  };
  // recorte do tabuleiro: só cantos, para as colunas nunca terem buracos no meio
  const FORMAS = {
    cheio: () => true,
    octo: (x, y, W, H) => Math.min(x, W - 1 - x) + Math.min(y, H - 1 - y) >= 1,
    gema: (x, y, W, H) => Math.min(x, W - 1 - x) + Math.min(y, H - 1 - y) >= 2,
    taca: (x, y, W, H) => Math.min(x, W - 1 - x) + (H - 1 - y) >= 2,
    arco: (x, y, W, H) => Math.min(x, W - 1 - x) + y >= 2,
  };

  // ---------- as 50 fases: tamanho | cores | metas | obstáculos | forma ----------
  // metas: c0..c5 (pedras por cor), pedra, ouro, geodo. Sem número = todas as que houver no tabuleiro.
  const T = [
    // Boca da mina
    '6x7|3|c0:12', '7x7|4|c0:12 c1:12', '7x8|4|c2:24', '7x8|4|c0:16 c3:16||octo', '7x8|4|pedra|pedra:base1',
    '7x8|4|c1:22 c2:22||arco', '7x8|4|c0:18 pedra|pedra:cantos', '7x8|4|c0:15 c1:15 c3:15||taca', '7x8|4|pedra|pedra:base2', '7x8|4|c2:20 pedra|pedra:degrau',
    // Lago fundo
    '7x8|4|ouro|ouro:centro', '7x8|4|ouro c0:18|ouro:base2', '7x8|4|ouro|ouro:cruz|octo', '7x8|5|c1:16 c4:16', '7x8|4|ouro pedra|ouro:base2 pedra:cantos',
    '8x8|5|ouro|ouro:anel|gema', '8x8|5|c0:16 c2:16 c3:16', '7x8|4|ouro pedra|ouro:base3 pedra:pilares', '8x8|5|ouro c4:18|ouro:xis', '8x8|4|ouro pedra|ouro:baixo pedra:degrau',
    // Gruta violeta
    '7x8|4|geodo:2', '7x8|4|geodo:3 c0:16', '7x8|4|geodo:2 pedra|pedra:base1', '7x8|5|geodo:3|pedra:cantos|arco', '7x8|4|pedra|pedra2:base1 pedra:coluna',
    '8x8|5|geodo:2 ouro|ouro:lados', '8x8|5|pedra c1:18|pedra2:cantos', '8x8|4|geodo:4|pedra:pilares', '8x8|5|ouro geodo:2|ouro:centro pedra:cantos|octo', '8x8|4|geodo:3 pedra|pedra:degrau',
    // Veio dourado
    '7x8|4|c0:16|grampo:faixa', '7x8|4|ouro|ouro:base2 grampo:coluna', '8x8|5|c2:18 c4:18|grampo:centro', '8x8|4|geodo:2 c1:16|grampo:faixa', '8x8|5|ouro pedra|ouro:xis pedra:base1|octo',
    '8x9|5|ouro|ouro2:centro grampo:anel', '8x9|4|pedra c0:20|pedra2:base1 grampo:coluna', '8x9|4|geodo:3|grampo:xadrez', '8x9|4|ouro c3:20|ouro2:base1 pedra:pilares|arco', '8x9|4|ouro geodo:2|ouro:degrau grampo:cantos',
    // Coração da terra
    '8x9|5|c0:22 c1:22 c4:22||gema', '8x9|4|pedra|pedra2:base2 pedra:coluna', '8x9|5|ouro pedra|ouro2:centro pedra2:cantos', '8x9|6|c2:18 c5:18|grampo:salpico', '8x9|4|geodo:3 ouro|ouro:base1 grampo:lados',
    '8x9|5|pedra ouro|pedra:vale ouro:centro', '8x9|5|geodo:3 c4:18|pedra:pilares', '8x9|5|ouro|ouro2:xis grampo:cantos|octo', '8x9|5|pedra geodo:2|pedra2:base1 grampo:faixa', '8x9|5|ouro pedra geodo:2|ouro:baixo pedra:degrau',
  ];
  // jogadas de cada fase, medidas por um jogador automático (ferramentas/gem-shatter/calibrar.mjs)
  const MOVS = /*MOVS*/[8, 16, 24, 16, 12, 22, 20, 15, 16, 19, 12, 20, 18, 26, 26, 29, 24, 22, 35, 25, 29, 42, 31, 45, 34, 45, 45, 31, 45, 28, 14, 21, 30, 45, 19, 34, 29, 45, 45, 45, 27, 45, 45, 33, 45, 27, 45, 45, 45, 45]/*FIM*/;
  const DICAS = {
    1: 'Toque em 2 ou mais pedras iguais que se encostam', 2: 'Cada fase tem um número de jogadas', 3: '5 pedras juntas viram uma broca; 7, uma carga; 9, um prisma',
    4: 'Pedras da mesma cor que caem juntas ressoam e quebram sozinhas', 5: 'Quebre ao lado da rocha para parti-la', 6: 'Dois especiais encostados se combinam',
    11: 'Quebre em cima do ouro para soltá-lo da parede', 21: 'Leve os geodos até o chão', 25: 'Granito aguenta duas pancadas', 31: 'Quebre ao lado para soltar a pedra grampeada', 36: 'Este ouro tem duas camadas',
  };

  function fase(n) {                                  // n começa em 1
    const [tam, k, metas, obst = '', forma = 'cheio'] = T[n - 1].split('|'), [W, H] = tam.split('x').map(Number);
    return { n, W, H, cores: +k, metas: metas.split(' ').map(m => m.split(':')), obst: obst ? obst.split(' ').map(o => o.split(':')) : [], forma: forma || 'cheio', movs: MOVS[n - 1] || 30, galeria: Math.floor((n - 1) / 10), dica: DICAS[n] || '' };
  }

  let seq = 0;
  const peca = (k, o) => Object.assign({ id: ++seq, k, c: -1, e: null, hp: 1, presa: false }, o);

  class Partida {
    constructor(def, rnd = Math.random) {
      this.def = def; this.rnd = rnd; const { W, H } = def; this.W = W; this.H = H;
      this.movs = this.movsTot = def.movs; this.pontos = 0; this.jogadas = 0;
      this.mask = []; this.ouro = new Array(W * H).fill(0); this.g = new Array(W * H).fill(null);
      const dentro = FORMAS[def.forma]; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) this.mask.push(!!dentro(x, y, W, H));
      this.topo = []; this.base = [];
      for (let x = 0; x < W; x++) { let t = -1, b = -1; for (let y = 0; y < H; y++) if (this.mask[y * W + x]) { if (t < 0) t = y; b = y; } this.topo.push(t); this.base.push(b); }
      let tent = 0; do { this._encher(); } while (!this.temJogada() && ++tent < 30);
      this.metas = {}; this.total = 0;
      for (const [m, q] of def.metas) { this.metas[m] = q ? +q : this._contar(m); this.total += this.metas[m]; }
      this.geodosFora = (this.metas.geodo || 0) - this.g.filter(p => p && p.k === GEODO).length;
      this.metasIni = { ...this.metas };
    }
    _cor() { return Math.floor(this.rnd() * this.def.cores); }
    _encher() {
      const { W, H, def } = this; this.ouro.fill(0);

    if (P.venceu) return vencer(ses); if (P.perdeu) return perder(ses);
    ocupado = false; Tela.marcar(); if (P.movs === 3) avisar('Só mais 3 jogadas');
    if (fila && Tela.agora - fila.t < .35) { const f = fila; fila = null; toque(f.x, f.y); } else fila = null;
  }
  // ---------- fim da fase ----------
  let ganho = null;
  function guardar() { const est = P.estrelas, sobra = P.movs; P.movsVis = sobra; ganho = { est, sobra, novo: false }; const novo = Progresso.venceu(n, est, P.pontos + sobra * 100); ganho.novo = novo; Eventos.emit('fase:vitoria', { n, estrelas: est, pontos: P.pontos, sobra }); }
  async function vencer(ses) {
    emBonus = true; Som.tensao(0); await Tela.assentar(); await Tela.espera(.15); if (ses !== Tela.sessao) return;
    const passos = P.bonus(); if (passos.length) { Tela.limparMarcas(); if (!await Tela.tocar(passos, 4)) return; }
    await Tela.assentar(); for (let k = 0; k < 60 && Tela.voando; k++) await Tela.espera(.02); if (ses !== Tela.sessao) return;
    for (const m in metasVis) metasVis[m] = 0; atualizarMetas(); Tela.acelerar(1); if (P.pontos > (D.recorde[n] || 0)) { D.recorde[n] = P.pontos; Progresso.salvar(); }
    Som.vitoria(); const fim = n >= Nucleo.TOTAL; $('vTit').textContent = fim ? 'Você chegou ao coração da mina' : ['', 'Fase vencida', 'Muito bem', 'Perfeito'][ganho.est];
    $('vTxt').textContent = `${fmt(P.pontos)} pontos` + (ganho.sobra ? ` · sobraram ${ganho.sobra} ${ganho.sobra > 1 ? 'jogadas' : 'jogada'}` : '') + (n % 10 === 0 && !fim ? `. Nova galeria: ${Nucleo.GALERIAS[P.def.galeria + 1]}` : '');
    $('bProx').textContent = fim ? 'Ver as fases' : 'Próxima fase'; $('vEst').innerHTML = [1, 2, 3].map(() => '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>').join('');
    abrir('vitoria'); emBonus = false; [...$('vEst').children].slice(0, ganho.est).forEach((s, k) => setTimeout(() => { if (aberto !== 'vitoria') return; s.classList.add('on'); Som.estrela(k); vibra(15); }, 260 + k * 260));
  }
  async function perder(ses) {
    acabou = true; await Tela.assentar(); await Tela.espera(.25); if (ses !== Tela.sessao) return;
    const extra = await Ganchos.oferecerContinuar({ n, progresso: P.progresso }); if (ses !== Tela.sessao) return;
    if (extra > 0) { P.movs += extra; acabou = false; ocupado = false; mostrarMovs(P.movs); Tela.marcar(); return; }
    D.est.derrotas++; Progresso.salvar(); Som.tensao(0); Som.derrota(); const pc = Math.floor(P.progresso * 100), faltam = Object.keys(P.metas).filter(m => P.metas[m] > 0); let tot = 0; faltam.forEach(m => tot += P.metas[m]);
    $('dTit').textContent = pc >= 85 ? 'Por pouco' : pc >= 60 ? 'Quase' : 'Acabaram as jogadas'; $('dTxt').textContent = tot === 1 ? 'Faltou só 1' : `Faltaram ${tot}`;
    $('dFalta').innerHTML = faltam.map(m => `<div class="meta"><img alt="${nomeMeta(m)}" src="${Arte.url(m)}"><span>${P.metas[m]}</span></div>`).join(''); $('dProg').style.width = pc + '%';
    Eventos.emit('fase:derrota', { n, progresso: P.progresso, faltam: tot }); abrir('derrota');
  }
  async function proxima() { if (n >= Nucleo.TOTAL) return mapa(); await Ganchos.entreFases({ n }); comecar(n + 1); }

  // ---------- mapa ----------
  let voltaDoMapa = 'abertura';
  function mapa() {
    if (aberto !== 'mapa') voltaDoMapa = aberto; let h = '', tot = 0; for (const k in D.estrelas) tot += D.estrelas[k]; $('tEstrelas').textContent = `${tot} de ${Nucleo.TOTAL * 3} estrelas`;
    Nucleo.GALERIAS.forEach((nome, gi) => { let s = 0; for (let k = 1; k <= 10; k++) s += D.estrelas[gi * 10 + k] || 0; h += `<h3>${nome}<small>${s} de 30</small></h3><div class="grade">`; for (let k = 1; k <= 10; k++) { const f = gi * 10 + k, e = D.estrelas[f] || 0; h += `<button class="fs${f === D.liberada ? ' atual' : ''}" data-f="${f}" ${f > D.liberada ? 'disabled' : ''} aria-label="Fase ${f}, ${e} estrelas">${f}<small>${'★'.repeat(e)}</small></button>`; } h += '</div>'; });
    $('listaMapa').innerHTML = h; abrir('mapa'); const a = document.querySelector('.fs.atual'); if (a) a.scrollIntoView({ block: 'center' });
  }
  function aberturaTela() { $('bJogar').textContent = D.liberada > 1 ? 'Continuar na fase ' + D.atual : 'Jogar'; abrir('abertura'); }

  // ---------- botões ----------
  const clica = (id, f) => $(id).addEventListener('click', () => { Som.iniciar(); Som.botao(); f(); });
  clica('bJogar', () => comecar(D.atual)); clica('bVerMapa', mapa); clica('bMapa', mapa); clica('bMapa2', mapa); clica('bMapa3', mapa); clica('bMapa4', mapa);
  clica('bFechaMapa', () => { if (voltaDoMapa === 'abertura' || !P) aberturaTela(); else if (acabou && !emBonus && voltaDoMapa) abrir(voltaDoMapa); else abrir(voltaDoMapa === 'pausa' ? null : voltaDoMapa); });
  clica('bPausa', () => { if (P && !acabou) abrir('pausa'); }); clica('bContinua', () => abrir(null)); clica('bRecomeca', () => comecar(n)); clica('bProx', proxima); clica('bDeNovo', () => comecar(n)); clica('bTenta', () => comecar(n));
  $('bSom').addEventListener('click', () => mudar('som')); document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => mudar(b.dataset.op)));
  $('listaMapa').addEventListener('click', e => { const b = e.target.closest('.fs'); if (b && !b.disabled) { Som.botao(); comecar(+b.dataset.f); } });
  addEventListener('keydown', e => { if (e.repeat) return; if (e.key === 'Escape') { if (aberto === 'pausa') abrir(null); else if (aberto === 'mapa') $('bFechaMapa').click(); else if (!aberto && !acabou) abrir('pausa'); } else if (e.key === 'm' || e.key === 'M') mudar('som'); else if ((e.key === 'r' || e.key === 'R') && P && (!aberto || aberto === 'derrota')) comecar(n); });

  return { comecar, toque, jogar, livre, chegou, somar, avisar, mostrarMovs, mapa, opcoes, aberturaTela, get P() { return P; }, get n() { return n; }, get aberto() { return aberto; }, get ocupado() { return ocupado; }, get metasVis() { return metasVis; }, get pts() { return pts; } };
})();

// ============================================================
// 8. PARTIDA DO PROGRAMA
// ============================================================
// no celular o som só é liberado quando o dedo SOLTA a tela (touchend/click)
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, () => Som.iniciar(), { passive: true, capture: true });
document.addEventListener('visibilitychange', () => { Som.dormir(document.hidden); if (document.hidden) Progresso.salvar(); });
for (const ev of ['touchmove', 'gesturestart']) document.addEventListener(ev, e => { if (!(e.target.closest && e.target.closest('.tela.on'))) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('dblclick', e => e.preventDefault());
Tela.iniciar(); Jogo.opcoes();
document.getElementById('fila').innerHTML = [0, 1, 2, 3, 4, 5].map(c => `<img alt="" src="${Arte.url('c' + c)}">`).join('');
if (location.pathname.includes('/jogos/gem-shatter/')) document.getElementById('lVolta').hidden = false;
Jogo.aberturaTela();
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__gemShatter = { Nucleo, Jogo, Tela, Som, Arte, Progresso, Eventos, Ganchos };
</script>
