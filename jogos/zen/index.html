<!doctype html>
<html lang="pt-BR" data-tema="noite" data-paleta="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2238">
<meta name="mobile-web-app-capable" content="yes">
<title>Zen</title>
<link rel="stylesheet" href="style.css">
<script>
/* ------------------------------------------------------------------
   NÚCLEO: o que os dois jogos e o áudio compartilham.
   Scripts comuns (sem "type=module") para abrir também por arquivo local.
   ------------------------------------------------------------------ */
window.Zen = {
  CHAVE: 'zen.v1',                 // onde o progresso fica salvo (localStorage)
  FASES: 50,
  DIFS: ['facil', 'medio', 'dificil'],
  NOMES: { loop: 'Loop Zen', okay: 'Ricochet Zen', facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' },
  menosMovimento: false,           // opção do jogador em "Som e aparência"
  jogos: {},                       // loop_game.js e okay_game.js se registram aqui

  /* Transforma um texto em número de 32 bits (FNV-1a). "loop/medio/17" dá sempre o mesmo número. */
  semente(texto) {
    let h = 2166136261;
    for (let i = 0; i < texto.length; i++) h = Math.imul(h ^ texto.charCodeAt(i), 16777619);
    h ^= h >>> 16; h = Math.imul(h, 2246822507); h ^= h >>> 13;
    return h >>> 0;
  },
  /* Sorteio que se repete igual em qualquer aparelho (mulberry32). */
  sorteio(semente) {
    let a = semente >>> 0;
    const r = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.entre = (min, max) => min + r() * (max - min);
    r.inteiro = (min, max) => min + Math.floor(r() * (max - min + 1));
    r.um = lista => lista[Math.floor(r() * lista.length)];
    r.chance = p => r() < p;
    return r;
  },
  /* Sorteio próprio de cada fase. "tentativa" só muda se o gerador recusar um desenho. */
  daFase(jogo, dif, fase, tentativa = 0) {
    return this.sorteio(this.semente(jogo + '/' + dif + '/' + fase + '/' + tentativa));
  }
};
</script>
<script defer src="audio.js"></script>
<script defer src="loop_game.js"></script>
<script defer src="okay_game.js"></script>
<script defer src="app.js"></script>
</head>
<body data-tela="inicio">

<!-- ícones -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-voltar" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <symbol id="i-proxima" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 8h9M19 8h1M4 16h1M11 16h9"/><circle cx="16" cy="8" r="2.6"/><circle cx="8" cy="16" r="2.6"/></symbol>
  <symbol id="i-som" viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.2l4.3 3.8V5.7L7.7 9.5zM15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
  <symbol id="i-mudo" viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.2l4.3 3.8V5.7L7.7 9.5zM16 9.8l4.4 4.4M20.4 9.8 16 14.2"/></symbol>
  <symbol id="i-refazer" viewBox="0 0 24 24"><path d="M6.2 8.2A7.2 7.2 0 1 1 4.8 12M5.4 4.4v4.2h4.2"/></symbol>
  <symbol id="i-grade" viewBox="0 0 24 24"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></symbol>
</svg>

<!-- jardim de areia ao fundo da tela inicial -->
<svg class="jardim" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="ondas" width="240" height="15" patternUnits="userSpaceOnUse">
      <path class="sulco" d="M0 7.5Q60 2.5 120 7.5T240 7.5"/>
    </pattern>
    <g id="aneis">
      <circle class="chao" r="158"/>
      <circle class="sulco" r="62"/><circle class="sulco" r="77"/><circle class="sulco" r="92"/>
      <circle class="sulco" r="107"/><circle class="sulco" r="122"/><circle class="sulco" r="137"/><circle class="sulco" r="152"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="url(#ondas)"/>
  <g transform="translate(745 640)"><use href="#aneis"/>
    <path class="sombra" d="M-40 24C-46-14-14-42 18-36 48-30 56 2 40 24 26 42-32 46-40 24Z"/>
    <path class="pedra" d="M-40 14C-46-24-14-50 18-44 48-38 54-8 40 14 26 32-32 36-40 14Z"/></g>
  <g transform="translate(330 770) scale(.82)"><use href="#aneis"/>
    <path class="sombra" d="M-46 20C-44-12-12-26 16-24 44-22 52 4 42 20 30 36-40 40-46 20Z"/>
    <path class="pedra" d="M-46 12C-44-20-12-34 16-32 44-30 52-4 42 12 30 28-40 32-46 12Z"/></g>
</svg>

<!-- ============ TELA INICIAL ============ -->
<main id="inicio" class="tela">
  <header class="barra">
    <a id="sair" class="redondo" href="../../index.html" aria-label="Todos os jogos" hidden><svg><use href="#i-grade"/></svg></a>
    <h1>Zen</h1>
    <button class="redondo mudo" type="button" data-acao="mudo" aria-pressed="false" aria-label="Som ligado"><svg><use href="#i-som"/></svg></button>
    <button class="redondo" type="button" data-acao="ajustes" aria-label="Som e aparência"><svg><use href="#i-ajustes"/></svg></button>
  </header>

  <div class="colunas">
    <div class="escolhas">
      <fieldset class="jogos">
        <legend class="so-leitor">Jogo</legend>
        <label class="jogo">
          <input type="radio" name="jogo" value="loop" checked>
          <svg viewBox="0 0 96 72" aria-hidden="true">
            <g class="faixa"><path d="M48 6A10 10 0 0 1 58 16A10 10 0 0 0 68 26A10 10 0 0 1 68 46A10 10 0 0 0 58 56A10 10 0 0 1 38 56A10 10 0 0 0 28 46A10 10 0 0 1 28 26A10 10 0 0 0 38 16A10 10 0 0 1 48 6Z"/></g>
            <g class="faixa fina"><path d="M48 6A10 10 0 0 1 58 16A10 10 0 0 0 68 26A10 10 0 0 1 68 46A10 10 0 0 0 58 56A10 10 0 0 1 38 56A10 10 0 0 0 28 46A10 10 0 0 1 28 26A10 10 0 0 0 38 16A10 10 0 0 1 48 6Z"/></g>
          </svg>
          <span class="nome">Loop Zen</span>
          <span class="linha">Gire as peças e feche o desenho</span>
        </label>
        <label class="jogo">
          <input type="radio" name="jogo" value="okay">
          <svg viewBox="0 0 96 72" aria-hidden="true">
            <path class="rastro" d="M16 58 46 18 72 46"/>
            <circle class="forma" cx="46" cy="12" r="7"/>
            <rect class="forma" x="69" y="44" width="15" height="15" rx="3.5" transform="rotate(18 76 51)"/>
            <circle class="bola" cx="16" cy="58" r="6"/>
          </svg>
          <span class="nome">Ricochet Zen</span>
          <span class="linha">Um lançamento, todas as formas</span>
        </label>
      </fieldset>

      <fieldset class="segmentos">
        <legend class="so-leitor">Dificuldade</legend>
        <label><input type="radio" name="dif" value="facil" checked><span>Fácil</span></label>
        <label><input type="radio" name="dif" value="medio"><span>Médio</span></label>
        <label><input type="radio" name="dif" value="dificil"><span>Difícil</span></label>
      </fieldset>

      <button id="continuar" class="principal" type="button" data-acao="continuar">Começar</button>
    </div>

    <section class="fases" aria-labelledby="t-fases">
      <h2 id="t-fases">Fases <span id="feitas"></span></h2>
      <div id="grade-fases" class="grade-fases"></div><!-- app.js cria os 50 botões -->
    </section>
  </div>
</main>

<!-- ============ TELA DE JOGO ============ -->
<section id="partida" class="tela" aria-label="Partida" hidden>
  <canvas id="quadro" tabindex="0" aria-label="Área do jogo"></canvas>
  <header class="barra">
    <button class="redondo" type="button" data-acao="inicio" aria-label="Voltar à tela inicial"><svg><use href="#i-voltar"/></svg></button>
    <p class="titulo-fase"><b id="t-fase">Fase 1</b><span id="t-info">Loop Zen, Fácil</span></p>
    <button class="redondo mudo" type="button" data-acao="mudo" aria-pressed="false" aria-label="Som ligado"><svg><use href="#i-som"/></svg></button>
    <button class="redondo" type="button" data-acao="ajustes" aria-label="Som e aparência"><svg><use href="#i-ajustes"/></svg></button>
  </header>
  <p id="aviso" class="aviso" role="status"></p>
  <footer class="rodape">
    <button class="redondo" type="button" data-acao="anterior" aria-label="Fase anterior"><svg><use href="#i-voltar"/></svg></button>
    <button class="redondo" type="button" data-acao="refazer" aria-label="Recomeçar a fase"><svg><use href="#i-refazer"/></svg></button>
    <button class="redondo" type="button" data-acao="proxima" aria-label="Próxima fase"><svg><use href="#i-proxima"/></svg></button>
  </footer>
  <div id="fim" class="fim" role="status" hidden>
    <p class="fim-texto"><b id="fim-titulo">Circuito fechado</b><span id="fim-detalhe"></span></p>
    <div class="fim-botoes">
      <button class="secundario" type="button" data-acao="refazer">Jogar de novo</button>
      <button class="principal" type="button" data-acao="proxima">Próxima fase</button>
    </div>
  </div>
</section>

<!-- ============ SOM E APARÊNCIA ============ -->
<dialog id="ajustes" class="folha" aria-labelledby="t-ajustes">
  <form method="dialog">
    <h2 id="t-ajustes">Som e aparência</h2>
    <label class="campo"><span>Música</span><input id="vol-musica" type="range" min="0" max="100" value="70"></label>
    <label class="campo"><span>Efeitos</span><input id="vol-efeitos" type="range" min="0" max="100" value="80"></label>
    <fieldset class="segmentos">
      <legend class="so-leitor">Cores</legend>
      <label><input type="radio" name="tema" value="noite" checked><span>Noite</span></label>
      <label><input type="radio" name="tema" value="pastel"><span>Pastel</span></label>
    </fieldset>
    <label class="campo chave"><span>Menos movimento</span><input id="menos-movimento" type="checkbox"></label>
    <button class="principal" type="submit">Pronto</button>
  </form>
</dialog>

</body>
</html>
